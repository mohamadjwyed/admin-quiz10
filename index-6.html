<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قانون الجنسية — دفتر المراجعة والاختبار</title>
<style>
  :root{
    --navy:#152238;
    --navy-2:#1d2f4d;
    --cream:#f4efe2;
    --paper:#fbf8f0;
    --brass:#b08d4f;
    --brass-light:#d9bd82;
    --ink:#2a2113;
    --maroon:#7a2a2a;
    --green:#2f5f3f;
    --line:#e2d8bf;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Tajawal','Segoe UI',sans-serif;
    background:var(--cream);
    color:var(--ink);
    line-height:1.75;
  }
  @font-face{
    font-family:'Tajawal';
    src:local('Tajawal');
  }
  header{
    background:linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 70%);
    color:var(--cream);
    padding:28px 20px 22px;
    text-align:center;
    border-bottom:4px solid var(--brass);
    position:relative;
  }
  header .seal{
    width:54px;height:54px;border:2px solid var(--brass-light);border-radius:50%;
    display:flex;align-items:center;justify-content:center;margin:0 auto 10px;
    font-size:22px;color:var(--brass-light);
  }
  header h1{
    margin:0;font-size:1.5rem;font-weight:800;letter-spacing:.5px;
  }
  header p{margin:6px 0 0;color:var(--brass-light);font-size:.85rem;}
  header .sub{color:#c9c0a8;font-size:.78rem;margin-top:4px;}

  nav.tabs{
    display:flex;max-width:760px;margin:16px auto 0;padding:0 14px;gap:8px;
  }
  nav.tabs button{
    flex:1;padding:12px 6px;border:2px solid var(--navy);background:var(--paper);
    color:var(--navy);font-family:inherit;font-weight:700;font-size:.92rem;
    border-radius:10px 10px 0 0;cursor:pointer;border-bottom:none;
  }
  nav.tabs button.active{background:var(--navy);color:var(--cream);}

  main{max-width:760px;margin:0 auto;padding:0 14px 60px;}
  .panel{
    background:var(--paper);border:2px solid var(--navy);border-radius:0 0 12px 12px;
    padding:18px 16px 26px;
  }

  /* stats bar */
  .stats{
    display:flex;gap:10px;margin:14px 0 18px;
  }
  .stat{
    flex:1;background:var(--navy);color:var(--cream);border-radius:10px;
    padding:10px 8px;text-align:center;
  }
  .stat b{display:block;font-size:1.3rem;color:var(--brass-light);}
  .stat span{font-size:.72rem;color:#c9c0a8;}
  .progress-bar{
    height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px;
  }
  .progress-bar > div{height:100%;background:var(--brass);transition:width .3s;}

  /* review section */
  .review-block{
    border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden;
  }
  .review-block summary{
    background:#efe6cf;padding:12px 14px;font-weight:800;cursor:pointer;color:var(--navy);
    list-style:none;display:flex;justify-content:space-between;align-items:center;
  }
  .review-block summary::-webkit-details-marker{display:none;}
  .review-block summary::after{content:'+';font-size:1.2rem;color:var(--brass);}
  .review-block[open] summary::after{content:'–';}
  .review-block .rb-content{padding:12px 16px 16px;font-size:.93rem;}
  .review-block .rb-content ul{margin:6px 0;padding-inline-start:20px;}
  .review-block .rb-content li{margin-bottom:6px;}
  .kw{color:var(--maroon);font-weight:700;}
  .trap{
    background:#fbeeea;border-inline-start:4px solid var(--maroon);
    padding:8px 12px;border-radius:6px;font-size:.85rem;margin-top:8px;
  }
  .trap b{color:var(--maroon);}

  /* test section */
  .q-header{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;
    font-size:.8rem;color:#6b5f42;
  }
  .q-card{
    background:#fff;border:2px solid var(--navy);border-radius:12px;padding:18px;
  }
  .q-type{
    display:inline-block;font-size:.72rem;font-weight:700;padding:3px 10px;
    border-radius:20px;margin-bottom:10px;
  }
  .q-type.tf{background:#e4e9f2;color:var(--navy);}
  .q-type.essay{background:#f0e6d2;color:var(--brass);color:#8a6a2f;}
  .freq-badge{
    display:inline-block;font-size:.72rem;font-weight:700;padding:3px 10px;
    border-radius:20px;margin:0 0 10px 6px;background:#f6e9d2;color:#8a5a1f;
    border:1px solid var(--brass);
  }
  .freq-toggle{
    display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--navy);
    background:#efe6cf;border-radius:8px;padding:9px 12px;margin-bottom:10px;cursor:pointer;
  }
  .freq-toggle input{width:16px;height:16px;accent-color:var(--brass);}
  .jumper button.freqQ{border:2px solid var(--brass);}
  .q-text{font-size:1.05rem;font-weight:700;margin:0 0 16px;color:var(--navy);}

  .tf-buttons{display:flex;gap:10px;margin-bottom:6px;}
  .tf-buttons button{
    flex:1;padding:12px;border-radius:8px;border:2px solid var(--green);
    background:#fff;color:var(--green);font-weight:800;font-size:.95rem;cursor:pointer;
    font-family:inherit;
  }
  .tf-buttons button:last-child{border-color:var(--maroon);color:var(--maroon);}
  .tf-buttons button.picked{color:#fff;}
  .tf-buttons button.picked.sah{background:var(--green);}
  .tf-buttons button.picked.khata{background:var(--maroon);}

  .essay-hint{
    color:#7a6f52;font-size:.85rem;margin-bottom:10px;
  }
  .reveal-btn{
    width:100%;padding:12px;border:none;border-radius:8px;background:var(--navy);
    color:var(--cream);font-weight:800;cursor:pointer;font-family:inherit;font-size:.95rem;
    margin-top:6px;
  }

  .answer-box{
    margin-top:16px;border-top:2px dashed var(--line);padding-top:14px;display:none;
  }
  .answer-box.show{display:block;}
  .verdict{
    display:inline-block;padding:4px 12px;border-radius:20px;font-weight:800;font-size:.85rem;
    margin-bottom:10px;
  }
  .verdict.sah{background:#e3f0e6;color:var(--green);}
  .verdict.khata{background:#f6e4e4;color:var(--maroon);}
  .cards4{display:grid;gap:10px;margin-top:10px;}
  .info-card{border-radius:8px;padding:10px 12px;font-size:.87rem;}
  .info-card b{display:block;margin-bottom:3px;font-size:.78rem;}
  .info-card.basis{background:#eef1f8;color:var(--navy);}
  .info-card.basis b{color:var(--navy);}
  .info-card.explain{background:#f5f2e9;color:#4a3f26;}
  .info-card.explain b{color:#8a6a2f;}
  .info-card.example{background:#eaf2ec;color:#274a34;}
  .info-card.example b{color:var(--green);}
  .info-card.trap{background:#fbeeea;color:#5c1f1f;}
  .info-card.trap b{color:var(--maroon);}

  .nav-buttons{display:flex;gap:10px;margin-top:18px;}
  .nav-buttons button{
    flex:1;padding:11px;border-radius:8px;border:2px solid var(--navy);
    background:var(--paper);color:var(--navy);font-weight:700;cursor:pointer;
    font-family:inherit;
  }
  .nav-buttons button:disabled{opacity:.35;cursor:default;}
  .nav-buttons button.primary{background:var(--navy);color:var(--cream);}

  .jumper{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px;}
  .jumper button{
    width:30px;height:30px;border-radius:6px;border:1px solid var(--line);
    background:#fff;font-size:.72rem;cursor:pointer;color:#6b5f42;
  }
  .jumper button.done{background:var(--line);}
  .jumper button.current{border-color:var(--navy);border-width:2px;font-weight:800;color:var(--navy);}
  .jumper button.wrong{background:#f6e4e4;color:var(--maroon);}

  .brand{
    text-align:center;margin-top:26px;padding-top:16px;border-top:1px solid var(--line);
    font-size:.78rem;color:#8a7d5c;
  }
  .brand b{color:var(--navy);}

  .finish-screen{text-align:center;padding:30px 10px;}
  .finish-screen h2{color:var(--navy);}
  .finish-screen .big{font-size:2.4rem;color:var(--brass);font-weight:800;}
</style>
</head>
<body>

<header>
  <p style="margin:0 0 14px;color:var(--brass-light);font-size:.95rem;font-weight:700;">بسم الله نبدأ</p>
  <div class="seal">⚖</div>
  <h1>قانون الجنسية</h1>
  <p>القانون الدولي الخاص ١ — دفتر مراجعة واختبار تفاعلي</p>
  <p class="sub">تطبيق إيوان التعليمي يتمنى لكم التوفيق والنجاح</p>
</header>

<nav class="tabs">
  <button id="tabReviewBtn" class="active" onclick="showTab('review')">قسم المراجعة</button>
  <button id="tabTestBtn" onclick="showTab('test')">الاختبار (٦٠ سؤال)</button>
</nav>

<main>
  <div class="panel" id="reviewPanel"></div>
  <div class="panel" id="testPanel" style="display:none;"></div>
</main>

<script>
/* ============ REVIEW DATA ============ */
const review = [
  {
    t: "١. تعريف القانون الدولي الخاص ومصادره",
    html: `
    <p><span class="kw">القانون الدولي الخاص</span> فرع من فروع القانون ذو طبيعة مختلطة يهدف إلى تنظيم علاقات الأفراد المشتملة على عنصر أجنبي، عن طريق قواعد موضوعية (مادية) تحدد جنسية الأشخاص ومركز الأجانب القانوني وتعيّن حالات اختصاص المحاكم، وقواعد إسنادية (تنظيمية) تحدد القانون الواجب تطبيقه.</p>
    <p><b>مواضيع القانون الدولي الخاص الأربعة:</b></p>
    <ul>
      <li>١. الجنسية</li>
      <li>٢. المركز القانوني للأجانب</li>
      <li>٣. تنازع القوانين</li>
      <li>٤. تنازع الاختصاص القضائي الدولي</li>
    </ul>
    <p><b>المصادر:</b></p>
    <ul>
      <li><span class="kw">رسمية أساسية:</span> المعاهدات الدولية، ثم القانون الداخلي (في سوريا: المرسوم ٢٧٦ لعام ١٩٦٩ لقانون الجنسية، والمواد ١١-٣٠ من قانون أصول المحاكمات لتنازع الاختصاص، والمواد ٣٠٦-٣١١ من القانون المدني لتنازع القوانين).</li>
      <li><span class="kw">رسمية تكميلية:</span> العرف الدولي (قليل الأهمية لقلة قواعده وافتقاره للمؤيدات)، ومبادئ القانون الدولي الخاص العامة (لا تُعمَل إلا بغياب نص تشريعي أو عرفي — المادة ٢٦ من القانون المدني السوري).</li>
      <li><span class="kw">غير رسمية:</span> الاجتهاد القضائي (يلعب دوراً خلاقاً، مكملاً للعرف أو النص)، والفقه (مصدر احتياطي غير رسمي).</li>
    </ul>
    <div class="trap"><b>فخ شائع:</b> المعاهدات تتفوق على القوانين الداخلية المخالفة لها (سابقة أو لاحقة)، لكن بشرط ألّا تخالف أحكام الدستور.</div>
    `
  },
  {
    t: "٢. الطبيعة الجدلية للقانون الدولي الخاص",
    html: `
    <p><b>هل هو قانون دولي أم داخلي؟</b> رأي: قانون دولي لأن نظرَه الدَّولي ليس إلا تعبيراً عن السيادة السياسية للدولة. الرأي الراجح: قانون داخلي، لأن العلاقات التي يحكمها هي في حقيقة الأمر علاقات الأفراد وليست علاقات الدول، ومصادره بأكثريتها وطنية "داخلية" وليست دولية مشتركة بين الدول.</p>
    <p><b>هل هو قانون خاص أم عام؟</b> رأي: خاص، اعتماداً على الصفة الخاصة لتنازع القوانين. الرأي الراجح: جزء من القانون العام، لأن الجنسية من صميم القانون العام إذ تتصل بكيان الدولة ذاتها، وتنازع القوانين لا يقتصر على القانون الخاص بل يقع أيضاً بين فروع القانون العام المختلفة (الجنائي، الإداري، المالي).</p>
    `
  },
  {
    t: "٣. تعريف الجنسية وأركانها وطبيعتها",
    html: `
    <p><span class="kw">الجنسية</span> رابطة قانونية وسياسية بين فرد ودولة معينة يصبح بموجبها هذا الفرد أحد المواطنين المكونين لشعب هذه الدولة.</p>
    <p><b>أركانها الثلاثة:</b> الفرد، والدولة، ورابطة قانونية وسياسية تجمع بينهما.</p>
    <p><b>الفرق بين الجنسية والقومية:</b> الجنسية علاقة قانونية سياسية بين الفرد والدولة، أما القومية فهي علاقة معنوية بين الفرد والأمّة.</p>
    <p><b>هل تُمنح إلا للشخص الطبيعي؟</b> الأصل نعم، لكن استثناءً واعتباراتٍ اقتصادية يمكن أن تُمنح الجنسية للأشياء (السفن والطائرات) أو للأشخاص الاعتبارية (الشركات).</p>
    <p><b>ارتباط الجنسية بالدولة:</b> الدولة تتمتع بالشخصية القانونية المستقلة، تتولى إنشاء الجنسية وتنظيم أحكامها استناداً إلى فكرة الولاء للدولة.</p>
    <p><b>صفتها السياسية:</b> تستند إلى اعتبارات سياسية تتصل بالدولة كوحدة سياسية يحدد أساسها على عنصر الشعب.</p>
    <div class="trap"><b>فخ شائع:</b> "لا تُعدّ الجنسية حقاً أساسياً من حقوق الإنسان" — العبارة خاطئة؛ الجنسية حق معترف به دولياً منذ ديباجة معاهدة جنيف ١٩٣٠ والمادة ١٥ من الإعلان العالمي لحقوق الإنسان ١٩٤٨ والمادة ٢٤ من العهد الدولي للحقوق المدنية والسياسية ١٩٦٦.</div>
    `
  },
  {
    t: "٤. حرية الدولة في تنظيم جنسيتها وحدودها",
    html: `
    <p><b>هل الحرية مطلقة؟</b> لا، مبدأ حرية الدولة ليس مطلقاً بل ترد عليه بعض القيود المستمدة من القانون الدولي.</p>
    <p><b>القيود الاتفاقية:</b> مثل اتفاقية لوزان.</p>
    <p><b>القيود غير الاتفاقية:</b> مصدرها العرف أو الاجتهاد القضائي الدولي — مثل مبدأ "الرابطة الفعلية".</p>
    <p><b>نتائج تطبيق مبدأ حرية الدولة واستقلالها:</b></p>
    <ul>
      <li>١. عدم اعتراف المحاكم الوطنية والأجنبية بالنظر في جنسية شخص أجنبي بالنسبة لها.</li>
      <li>٢. عدم سريان نصوص تشريعات الدول الأخرى التي تتدخل في تنظيم جنسية دولة ما، لأن مثل هذا النص يشكل تعدياً واضحاً على حق المشرع في تنظيم جنسية بلاده وتحديد الأشخاص الذين ينتمون إليها.</li>
      <li>٣. نشوء مشكلة تنازع الجنسيات (إيجابي أو سلبي) بسبب اختلاف الدول في مبادئها الناظمة لاكتساب الجنسية.</li>
    </ul>
    <p><b>تنازع الجنسيات الإيجابي والسلبي:</b> تعدد الجنسيات (Conflit positif) هو تمتع الشخص بأكثر من جنسية في وقت واحد، وانعدام الجنسية (Conflit négatif) هو عدم تمتع الشخص بأية جنسية.</p>
    <p><b>حل تنازع الجنسيات الإيجابي:</b> إذا كانت إحدى الجنسيات المتنازعة هي جنسية دولة القاضي، يُقضى بتغليب جنسية دولة القاضي (مثال: نزاع بين الجنسية السورية والتركية واللبنانية أمام قاضٍ سوري → يُطبَّق القانون السوري). إذا كانت جميع الجنسيات المتنازعة أجنبية عن القاضي، يُغلَّب مبدأ الجنسية الفعلية (الأقرب ارتباطاً بواقع الفرد).</p>
    <p><b>حل تنازع الجنسيات السلبي:</b> لا يوجد حل قانوني منصوص عليه، والرأي الراجح استقر على تطبيق قانون الموطن، أو محل الإقامة عند تعذر معرفة الموطن.</p>
    `
  },
  {
    t: "٥. الجنسية العثمانية والانتقال إلى الجنسية السورية",
    html: `
    <p><b>الجنسية العثمانية:</b> ليست قائمة على أساس ديني، بل نصت المادة ٩ من قانون الجنسية العثماني لعام ١٨٦٩ على أن كل شخص مقيم في الديار العثمانية يُعدّ عثمانياً.</p>
    <p><b>قواعد الانتقال بين الجنسية العثمانية والسورية:</b> حرية الاختيار — أي شخص موجود على الإقليم السوري عند إعطائه حرية الخيار إمّا أن يختار الجنسية السورية أو التركية. إذا اختار التركية وجب مغادرة الأراضي السورية خلال ١٢ شهراً (وفق اتفاقية لوزان). القُصَّر يتبعون جنسية والدهم، ولهم حرية الخيار عند بلوغهم الثامنة عشرة.</p>
    `
  },
  {
    t: "٦. الجنسية السورية الأصلية: حق الدم وحق الإقليم",
    html: `
    <p>أخذ المشرع السوري بحق الدم بشكل أساسي، وفي <span class="kw">ثلاث حالات</span>: الدم منفردة، الإقليم منفردة، والدم والإقليم معاً (بالإضافة إلى الانتماء بالأصل للجمهورية العربية السورية في حالة منفردة).</p>
    <p><b>١. حق الدم منفرداً — شروطه:</b></p>
    <ul>
      <li>أن يكون الأب متمتعاً فعلاً بجنسية الجمهورية العربية السورية عند ولادة الطفل، أو وقت الوفاة إذا توفي الأب قبل الميلاد.</li>
      <li>أن يثبت نسب المولود لأبيه وفقاً لأحكام النسب في القانون السوري، سواء أثبت النسب وقت الميلاد أم بعده.</li>
      <li>لا يشترط أن يكون الأب مقيماً في القطر السوري، ولا يشترط أن يكون ولد هو وآباؤه فيه.</li>
    </ul>
    <p>وتثبت الجنسية سواء أتمّت الولادة داخل القطر أم خارجه، وسواء كانت الأم وطنية أو أجنبية أو عديمة الجنسية. أما حق الدم من ناحية الأم وحدها فلا يُكسِب الجنسية السورية.</p>
    <p><b>٢. حق الإقليم منفرداً — حالاته:</b></p>
    <ul>
      <li>المولودون في القطر السوري لأب وأم مجهولين.</li>
      <li>المولودون في القطر السوري لأب مجهول وأم معروفة ولكن لا جنسية لهما، أو لهما جنسية غير معروفة أو غير ثابتة بتاريخ ميلادهم.</li>
      <li>الأولاد الشرعيون الذين لم يستطيعوا عند ولادتهم اكتساب جنسية أجنبية استناداً إلى صلة النبوّة.</li>
    </ul>
    <p><b>٣. حق الدم والإقليم معاً — شروطه:</b></p>
    <ul>
      <li>أن تكون الأم سورية.</li>
      <li>أن تتمّ الولادة على الإقليم السوري.</li>
      <li>عدم ثبوت نسب الطفل لأبيه.</li>
    </ul>
    <div class="trap"><b>فخ شائع جداً:</b> "من ولد خارج القطر من أم سورية يكتسب الجنسية بحكم الدم" — خطأ؛ اكتساب الجنسية بحق الدم والإقليم معاً يقتصر على الأب دون الأم إلا في هذه الحالة الأخيرة (الدم+الإقليم)، وحتى فيها لا بد من ولادة داخل القطر.</div>
    <div class="trap"><b>فخ:</b> من وُلد من أب سوري وأم ألمانية على الأراضي الألمانية يكتسب الجنسية السورية بحكم الدم (لأن أباه سوري متمتع بجنسيته)، أما الجنسية الألمانية فهذا الأمر يعود للقوانين المعمول بها في ألمانيا بهذا المجال (حق الإقليم الألماني)، فيكتسب الجنسيتين معاً وفق كل قانون على حدة.</div>
    `
  },
  {
    t: "٧. التجنس (الجنسية اللاحقة)",
    html: `
    <p>أسس اكتساب الجنسية اللاحقة أو الطارئة للميلاد: تبدُّل السيادة، الميلاد، الإقامة، التجنس، الزواج.</p>
    <p><b>هل يؤدي تحقق شروط طالب التجنس إلى منحه الجنسية تلقائياً؟</b> لا؛ التجنس منحة من الدولة وليس حقاً للفرد، ولها أن تمنحها أو لا تمنحها، والأمر يخضع لتقديرها المطلق.</p>
    <p><b>شروط طالب التجنس العادي:</b></p>
    <ul>
      <li>أ. كامل الأهلية.</li>
      <li>ب. مقيماً في القطر إقامة متتالية مدة خمس سنوات على الأقل سابقة لتقديم الطلب.</li>
      <li>ج. خالياً من الأمراض السارية والعاهات التي تمنعه من مزاولة أي عمل.</li>
      <li>د. حسن السلوك ومحمود السمعة، ولم يسبق الحكم عليه بعقوبة جنائية أو عقوبة مقيدة للحرية في جريمة شائنة.</li>
      <li>هـ. ذا اختصاص أو خبرة يمكن الاستفادة منها في القطر، أو أن تكون له وسيلة مشروعة للكسب أو يملك ما يغنيه عن مساعدة الغير.</li>
      <li>و. ملماً باللغة العربية قراءة وكتابة.</li>
    </ul>
    <p><b>إجراءات المنح:</b> يُقرَن الطلب بإيجاب وزير الداخلية، وتتولى الوزارة تنظيم مشروع مرسوم بمنح الجنسية، ويُرفع إلى رئيس الجمهورية (المادة ٢٦). يكتسب المتجنس الجنسية اعتباراً من تاريخ صدور المرسوم بتوقيع رئيس الجمهورية، لا من تاريخ نشره. ولا يحق لوزير الداخلية أو لطالب التجنس الطعن بقرار الرفض، لأن التجنس منحة من الدولة وليس حقاً للفرد.</p>
    <p><b>التجنس بصورة إفرادية:</b> الأصل أن المرسوم لا يتناول إلا شخصاً واحداً، واستثناءً أجاز المشرع (المادة الخامسة النافذة حالياً) منح أفراد الأسرة الواحدة الجنسية بمرسوم واحد تسهيلاً وتخفيفاً للشكليات.</p>
    <p><b>حالات التجنس الاستثنائي (المادة السادسة):</b> يجوز منح جنسية الجمهورية العربية السورية دون التقيد بشروط التجنس العادية إلى:</p>
    <ul>
      <li>١. المواطنون المغتربون.</li>
      <li>٢. الأشخاص الذين أدَّوا للدولة أو للأمة العربية خدمات جليلة.</li>
      <li>٣. المنتمون بأصلهم إلى أحد البلاد العربية.</li>
    </ul>
    <p><b>شروط منح الجنسية للمواطن المغترب:</b> أن يكون حائزاً على شهادة مواطن مغترب (منتمياً بأصله إلى بلد عربي، ولا يقيم في أية دولة عربية ولا يحمل جنسية أية دولة منها)، وأن يكون غير منتمٍ لأي حزب أو جمعية أو ناد يناوئ الاتجاه القومي، وأن يقدم بطلب خطي يعبّر فيه صراحة عن رغبته في اكتساب الجنسية العربية السورية ولم يتقدم بطلب لاختيارها ضمن المهل السابقة. لا تترتب الجنسية حكماً لمجرد حمل شهادة مغترب؛ لا بد من طلب أيضاً، ويُمنح بمرسوم جمهوري بناءً على اقتراح وزير الداخلية.</p>
    <p><b>الأشخاص الذين أدوا خدمات جليلة أو المنتمون بأصلهم لبلد عربي:</b> تُمنح الجنسية لهؤلاء على سبيل التكريم والتقدير، وغالباً ما يتم استمزاج رأيهم قبل تنظيم مرسوم منحهم الجنسية، فلا تُفرض عليهم فرضاً، كما لا يُشترط لاكتسابها تقديم طلب بذلك من قبل صاحب الشأن. أما المنتمي بأصله إلى إحدى البلاد العربية فيشترط إضافة إلى شرط الانتماء بالأصل، أن يتقدم من ينطبق عليه هذا الوصف بطلب يعبّر فيه عن رغبته باكتساب الجنسية العربية السورية.</p>
    <div class="trap"><b>فخ:</b> أبناء البلدان العربية يُعفَون من شرط الإقامة العادية، ومن شرط الإلمام باللغة العربية (لأنه مفترض إتقانها)، لكن لا يُعفَون من بقية الشروط.</div>
    `
  },
  {
    t: "٨. المرأة والجنسية (اكتساباً وفقداناً)",
    html: `
    <p><b>شروط اكتساب المرأة الأجنبية الجنسية السورية بالزواج:</b></p>
    <ul>
      <li>أ. أن تقدم طلباً بذلك إلى الوزارة.</li>
      <li>ب. أن تستمر الزوجية قائمة مدة سنتين من تاريخ الطلب.</li>
      <li>ج. أن تكون مقيمة في القطر إقامة مشروعة.</li>
      <li>د. أن يصدر قرار من وزير الداخلية بإكسابها الجنسية.</li>
    </ul>
    <p>لا تكتسبها بمجرد إبداء الرغبة؛ يُشترط صدور قرار من الوزير، وتكتسبها من تاريخ صدور القرار لا من تاريخ الطلب ولا من تاريخ الزواج.</p>
    <p><b>شروط اكتساب المرأة العربية الجنسية عن طريق الزواج (سؤال دورة متكرر):</b> أُعفيت المرأة العربية من شرط استمرار الزوجية مدة سنتين ومن شرط الإقامة خلال هذه المدة، واكتُفي لها بالشروط التالية:</p>
    <ul>
      <li>١. أن تكون متمتعة بجنسية بلد عربي أو من أصل سوري تتمتع بالجنسية العربية السورية.</li>
      <li>٢. أن تقدم طلباً خطياً تبين فيه رغبتها الدخول في جنسية زوجها.</li>
      <li>٣. أن يصدر قرار من وزير الداخلية بمنحها الجنسية وتكتسب الزوجة الجنسية اعتباراً من تاريخ تقديمها الطلب وليس من تاريخ قرار الوزير.</li>
      <li>٤. أما بالنسبة لشرط صحة عقد زواجها، فلا بد في هذه الحالة أن يكون صحيحاً من حيث الموضوع ووفقاً لأحكام الزواج في القانون السوري.</li>
    </ul>
    <div class="trap"><b>فخ دقيق جداً:</b> بخلاف الزوجة الأجنبية (تكتسب من تاريخ قرار الوزير)، الزوجة العربية تكتسب الجنسية من تاريخ تقديمها الطلب لا من تاريخ صدور القرار — رغم أن قرار الوزير لا بدّ منه أيضاً.</div>
    <p><b>شروط فقدان المرأة العربية السورية الجنسية بزواجها من أجنبي:</b></p>
    <ul>
      <li>١. أن تعلن رغبتها في اكتساب جنسية زوجها بطلب خطي، سواء عند الزواج أم خلال قيام رابطة الزوجية.</li>
      <li>٢. أن يسمح قانون زوجها بدخولها في جنسيته وذلك كي لا تصبح المرأة الوطنية عديمة الجنسية إذا فقدت جنسيتها دون أن تتمكن من اكتساب جنسية زوجها الأجنبية.</li>
      <li>٣. أن يكون عقد زواج المرأة السورية بالأجنبي صحيحاً وفقاً لأحكام صحة الزواج في القانون السوري.</li>
    </ul>
    <p><b>شروط فقدان العربي السوري جنسيته بسبب اكتساب جنسية أجنبية:</b></p>
    <ul>
      <li>١. أن يقدم طلباً خطياً يعبّر فيه عن رغبته الصريحة بالتخلي عن جنسيته العربية السورية بقصد التجنس بجنسية أجنبية.</li>
      <li>٢. أن يأذن له بالتخلي عن الجنسية العربية السورية مرسوم يصدر عن رئيس الجمهورية بناء على اقتراح وزير الداخلية.</li>
      <li>٣. أن يكتسب طالب التخلي الجنسية الأجنبية بإرادته وبناء على طلبه، فلا يُعتبر اكتسابها بموجب قوانين الدولة الأجنبية سبباً لفقدان الجنسية العربية إذا كانت مفروضة عليه دون طلب منه.</li>
    </ul>
    <div class="trap"><b>فخ:</b> "عدم السماح للعربي السوري بالتخلي عن جنسيته يمنعه من اكتساب جنسية أجنبية" — خطأ؛ التجنس بجنسية أجنبية لا يتوقف على إذن دولة التجنس الأصلية، وعدم السماح بالتخلي لا يمنع اكتسابه جنسية أجنبية دون أن يعتد بها.</div>
    `
  },
  {
    t: "٩. فقدان الجنسية: السحب — الإسقاط — التجريد",
    html: `
    <p><b>السحب:</b> حقّ للدولة لنفسها بسحب جنسيتها عن الشخص الأجنبي الذي اكتسبها لاحقة على الميلاد (بالتجنس والزواج)، خلال فترة معينة من دخوله فيها، إذا أتى عملاً يدل على عدم اندماجه في مجتمع الدولة، أو على عدم ولائه لها أو على عدم جدارته بحمل جنسيتها.</p>
    <p><b>الإسقاط:</b> على خلاف السحب، يمكن أن توقعه الدولة بحق الشخص سواء أكانت جنسيته أصلية أم مكتسبة وفي أي وقت كان. وأهم حالاته: الإسقاط لارتباط الوطني بدولة أجنبية عن طريق الإقامة على إقليمها أو العمل في إدارتها أو في جيشها بشكل يتعارض مع مصالح دولته.</p>
    <p><b>الاسترداد والرد:</b> الاسترداد حقّ للشخص وليس منحة من الدولة (اختصّ به المشرع السوري الزوجة والأولاد القصّر)، فهؤلاء يجوز لهم استرداد جنسيتهم. أما الرد فهو منحة من الدولة وليس من حق الشخص، فمسألة رد الجنسية مسألة متعلقة بالسلطة التقديرية للدولة.</p>
    <p><b>هل من فقد الجنسية بردّه يحق له استرداد جنسيته؟</b> لا، لأنه فقدها بالتجريد، لكن يجوز للدولة وفقاً لسلطتها التقديرية أن ترُدّ له الجنسية.</p>
    <p><b>الفرق بين فقدان الجنسية بالتغيير وفقدانها بالتجريد:</b> بموجب قانون الجنسية السورية الحالي يمكن للفرد أن يفقد جنسيته إما بسبب إرادي (بالتغيير أو التخلي)، أو بسبب تأديبي على سبيل الجزاء (بالتجريد). لمن فقد جنسيته بالتغيير المطالبة باستردادها، أما من فقدها بالتجريد فيحق له الرد لا الاسترداد، والرد منحة من الدولة وليس حقاً للفرد.</p>
    <p><b>حالات فقدان الجنسية العربية السورية بالتغيير:</b> إما بسبب اكتسابه جنسية أجنبية، وإما بمفعول الزواج، وإما برجوعه عنها إلى جنسيته الأجنبية الأصلية السابقة.</p>
    <p><b>التجريد القضائي:</b> لا يكون إلا في حالة واحدة هي اكتساب الجنسية اعتماداً على بيان كاذب أو بطريق التدليس (المادة ٢٠ من قانون الجنسية) — كتقديم معلومات غير صحيحة أو بيانات أو وثائق أو شهادات مزورة، أو السكوت عمداً عن واقعة أو ملابسة لو عُلمت بها السلطات الوطنية المختصة لامتنعت عن منح الجنسية. وهو <span class="kw">وجوبي</span> على المحكمة إذا ثبت التدليس، وليس جوازياً. يشمل حكم هذه المادة المتجنس سواء كان أجنبياً أم عربياً.</p>
    <p><b>المحكمة المختصة بالتجريد القضائي:</b> محكمة الولاية صاحبة النظر في جرم البيان الكاذب هي محكمة بداية الجزاء، وتتحرك دعوى التجريد من قبل النيابة العامة بناء على طلب الإدارة المعنية تبعاً للدعوى الجزائية. ولأن التجريد يتم لارتكاب جريمة جنحية، تخضع لمدة التقادم التي ينص عليها قانون العقوبات لأمثال هذه الجرائم، وهي ثلاث سنوات، تبدأ من تاريخ وقوع الجريمة بالنسبة لتقديم البيان الكاذب، ومن تاريخ انكشاف حيل صاحب المصلحة بالنسبة للتدليس.</p>
    <p><b>التجريد الإداري:</b> يمكن أن يُجرَّد العربي السوري من جنسيته بمرسوم معلَّل بناء على اقتراح من وزير الداخلية في <span class="kw">سبع حالات</span> هي:</p>
    <ul>
      <li>١. تجنس المواطن العربي السوري بجنسية أجنبية قبل السماح له بالتخلي عن جنسيته.</li>
      <li>٢. دخول المواطن العربي السوري باختياره في الخدمة العسكرية لدى دولة أجنبية دون ترخيص سابق.</li>
      <li>٣. الاستخدام لدى دولة أجنبية بأية صفة كانت.</li>
      <li>٤. النشاط والعمل لصالح بلد هو في حالة حرب مع القطر السوري.</li>
      <li>٥. مغادرة البلاد بصورة غير مشروعة إلى بلد هو في حالة حرب مع القطر السوري.</li>
      <li>٦. ما يتعلق بمصلحة أمن البلاد وسلامتها.</li>
      <li>٧. مغادرة البلاد نهائياً بقصد الاستيطان في بلد غير عربي.</li>
    </ul>
    <p><b>شروط التجريد لمن غادر البلاد نهائياً بقصد الاستيطان في بلد غير عربي:</b></p>
    <ul>
      <li>١. أن يغادر المواطن العربي السوري القطر نهائياً بقصد الاستيطان في بلد غير عربي.</li>
      <li>٢. أن يكون قد استوطن في بلد أجنبي غير عربي، سواء حصل على جنسية هذا البلد أم لم يحصل عليها، أما إذا تمّ الاستيطان في بلد عربي فلا يستكمل التجريد شروطه.</li>
      <li>٣. ألا تتجاوز غيبته خارج البلاد مدة ثلاث سنوات، لا فرق لأن أمضى هذه المدة في بلد الاستيطان أم في عدة بلاد أجنبية أخرى، على أن يكون هذا الغياب مقترناً بنيّة الاستيطان التي يُستدل عليها من ظروف الحال.</li>
      <li>٤. أن تقوم وزارة الداخلية بإخطاره بالعودة إلى القطر خلال ثلاثة أشهر من تاريخ تبليغه الإخطار وأن يرفض الامتثال لهذا الإخطار خلال هذه المدة، وذلك إما بعدم الرد أو بالرد بأسباب غير مقنعة.</li>
    </ul>
    <div class="trap"><b>فخ متكرر:</b> "قوات ثورية غير نظامية" لا تدخل في مفهوم الخدمة العسكرية التي رتب عليها المشرع وجوب تجريد المواطن من جنسيته — لا بدّ من الدخول فعلاً في الخدمة العسكرية النظامية داخل البلاد أو خارجها.</div>
    <div class="trap"><b>فخ:</b> "النشاط والعمل لصالح بلد هو في حالة حرب مع سوريا يُبرِّر التجريد القضائي" — خطأ؛ هذه حالة من حالات التجريد الإداري وليس القضائي.</div>
    <p><b>تنويه هام:</b> إذا تم التجريد قضائياً فإن الزوجة والأولاد يُجرَّدون أيضاً باعتبارهم اكتسبوها بالتبعية، أما التجريد الإداري فلا ينال إلا من الشخص المجرد ولا أثر له على الزوجة ولا على الأولاد.</p>
    `
  },
  {
    t: "١٠. استرداد الجنسية والإثبات",
    html: `
    <p><b>شروط استرداد الجنسية السورية لأولاد القصّر الذين فقدوها بسبب تجنس أبيهم السوري بجنسية أجنبية واكتسبوا جنسيتهم الجديدة بالتبعية:</b> أن يكونوا قد بلغوا سنّ الرشد وفقاً لقانون الجنسية السوري، وأن يعلنوا اختياره للجنسية السورية بطلب أصولي خلال سنة من تاريخ بلوغه سن الرشد، وأن تكون إقامته العادية في القطر، وأن يكون قد عاد إليه بقصد الإقامة الدائمة إذا كان قد غادره إلى خارج البلاد، وأن يسمح له وزير الداخلية باسترداد جنسيته بقرار يصدر عنه.</p>
    <p><b>استرداد الزوجة التي فقدت جنسيتها بزواجها من أجنبي أو بتجنس زوجها بجنسية أجنبية:</b> تستردها عند انتهاء حالة الزوجية سواء بالوفاة أو الطلاق، بالإضافة إلى تقديم طلب خطي تعبّر فيه عن رغبتها في العودة إلى جنسيتها الأصلية إلى وزارة الداخلية وموافقة وزير الداخلية على طلبها. وبموجبه تسترد المرأة جنسيتها السورية اعتباراً من تاريخ صدوره لا من تاريخ انتهاء الزوجية، والمشرع لم يستلزم من أجل استرداد المرأة السورية لجنسيتها أن تتنازل عن جنسيتها الأجنبية.</p>

{type:'essay', q:'ما هي النتائج التي تترتب على تطبيق مبدأ حرية الدولة واستقلالها في تنظيم الجنسية؟', ans:'١. عدم الاعتراف للمحاكم الوطنية والأجنبية بالنظر في جنسية شخص أجنبي بالنسبة لها. ٢. عدم سريان نصوص تشريعات الدول التي تتدخل في تنظيم جنسية دولة ما، لأن مثل هذا النص يشكل تعدياً واضحاً على حق المشرع في تنظيم جنسية بلاده وتحديد الأشخاص الذين ينتمون إليها. ٣. نشوء مشكلة تنازع الجنسيات.', basis:'—', example:'—', tip:'سؤال دورة متكرر جداً بصيغة "صح أو خطأ مع التعليل" أيضاً — احفظ الثلاث نتائج بالترتيب.'},
{type:'tf', q:'الدولة لها مطلق الحرية في تنظيم جنسيتها.', correct:false, ans:'خطأ؛ إن مبدأ حرية الدولة في تنظيم جنسيتها ليس مطلقاً، بل ترد عليه بعض القيود المستمدة من القانون الدولي، فالقانون الدولي فرض عليها قيوداً اتفاقية مثل اتفاقية لوزان، أو قيود غير اتفاقية مثل العرف والاجتهاد الدوليين على سبيل المثال "الرابطة الفعلية".', basis:'—', example:'اتفاقية لوزان قيّدت حرية سوريا وتركيا في تنظيم انتقال الجنسية العثمانية.', tip:'هذا السؤال هو الأكثر تكراراً في كل نماذج الامتحانات المرسلة — احفظه جيداً بحذافيره.', freq:'مكرر جداً جداً — ظهر بنفس النص تقريباً في أغلب النماذج المرسلة بلا استثناء.'},
{type:'tf', q:'ممكن أن يكون هناك قيود دولية غير اتفاقية ترد على حرية الدولة في تنظيم جنسيتها.', correct:true, ans:'صح، ويُقصد بذلك القيود التي يقررها القانون الدولي التي مصدرها العرف أو الاجتهاد القضائي الدولي.', basis:'—', example:'مبدأ "الرابطة الفعلية" الذي كرّسه الاجتهاد القضائي الدولي.', tip:'هذا امتداد مباشر للسؤال السابق — إذا حفظت أحدهما تحفظ الآخر.'},
{type:'essay', q:'تحدث عن أسباب مشكلة تنازع الجنسيات وعرّف التنازع الإيجابي والتنازع السلبي.', ans:'إنّ ممارسة الدول لحريتها في تنظيم جنسيتها وتحديد رعاياها، ومدى مراعاتها لحق الفرد في أن تكون له جنسية واحدة، واختلافها في ذلك للمبادئ الأخرى التي تعد من مستلزمات تطبيق هذا المبدأ، يؤدي إلى اختلاف وتباين القواعد الناظمة لاكتساب الجنسية الأصلية أو الطارئة في تشريعاتها. وهذا الاختلاف من شأنه أن يؤدي بالتالي على الصعيد الدولي، إلى قيام ظاهرة بارزة، هي مشكلة تنازع الجنسيات، أي وجود أشخاص يتمتعون في وقت واحد بأكثر من جنسية، وهذا ما يُعرف بتعدد الجنسيات (تنازع إيجابي)، وأشخاص لا يتمتعون بأية جنسية، وهذا ما يُطلق عليه انعدام الجنسية (تنازع سلبي).', basis:'—', example:'شخص وُلد لأب سوري (حق دم) وعلى إقليم دولة تأخذ بحق الإقليم يحمل جنسيتين معاً (تنازع إيجابي).', tip:'اربط السبب دوماً بـ"اختلاف الدول في مبادئ منح الجنسية" — هي الجملة المحورية في التعليل.'},
{type:'essay', q:'كيف يتم حل مشكلة تنازع الجنسيات الإيجابي؟', ans:'يميّز الفقه والقضاء بصدد التنازع الإيجابي بين حالتين. الأولى: الحالة التي تكون فيها إحدى الجنسيات المتنازعة هي جنسية دولة القاضي، ففي هذه الحالة التي فيها التنازع بين جنسية دولتين أو أكثر بصدد شخص ما، إذا عُرض النزاع أمام محاكم إحدى هذه الدول فإن الحل المعمول به فقهاً وقضاءً يقضي بتغليب جنسية دولة القاضي على باقي الجنسيات. فإذا كان التنازع يتعلق بجنسية شخص يتمتع في الوقت نفسه بالجنسية السورية والتركية واللبنانية وطرح هذا النزاع في سورية فإن القاضي السوري لا يعتد ولا يعترف سوى بجنسية بلاده، أي الجنسية العربية السورية. ويكون ملزماً بتطبيق القانون السوري. الثانية: الحالة التي تكون فيها الجنسيات المتنازعة كلها أجنبية بالنسبة للقاضي الذي ينظر في النزاع، فبالنسبة للرأي السائد في الفقه الحديث يقول بتغليب الجنسية الفعلية على غيرها من الجنسيات التي يتمتع بها الفرد (أي الجنسية التي يتبين من ظروف الواقع أن الفرد يرتبط بها أكثر من غيرها).', basis:'—', example:'إذا اجتمعت جنسيتا فرنسا وألمانيا لشخص، ونظر النزاع أمام قاضٍ سوري (طرف ثالث)، طُبِّقت الجنسية الفعلية الأقرب لواقع الفرد.', tip:'رتّب الجواب: حالتان، والحل يختلف بينهما — القاضي دائماً يفضّل جنسية بلاده، وإلا فالجنسية الفعلية.'},
{type:'tf', q:'لا يوجد حل قانوني لمشكلة تنازع الجنسيات السلبي.', correct:true, ans:'صح، لكن الرأي الراجح في الفقه الحديث والذي استقر عليه العمل في قضاء الكثير من الدول يقضي في هذه الحالة بتطبيق قانون الموطن باعتباره أكثر القوانين صلة بعديم الجنسية، ويلبي الاعتبارات نفسها التي يقوم عليها اختصاص قانون الجنسية في مسائل الأحوال الشخصية، وفي حال تعذر معرفة موطن عديم الجنسية يُطبق قانون محل الإقامة.', basis:'—', example:'—', tip:'الملاحظ أن هذا الحل يقوم على مشابهة لفكرة الجنسية الفعلية المتخذة أساساً لحل تعدد الجنسيات الأجنبية من حيث أنه يأخذ بعين الاعتبار الارتباط الحقيقي والفعلي لعديم الجنسية بدولة معينة استناداً إلى رابطة الموطن أو محل الإقامة.'},
{type:'tf', q:'الجنسية العثمانية هي جنسية قائمة على أساس ديني.', correct:false, ans:'خطأ، تنص المادة ٩ من قانون الجنسية العثماني ١٨٦٩ على أنه "كل شخص مقيم في الديار العثمانية يُعدّ عثمانياً".', basis:'المادة ٩ من قانون الجنسية العثماني لعام ١٨٦٩.', example:'—', tip:'هذا السؤال حرفي وثابت في كل نموذج امتحان تقريباً — أساسها إقليمي (الإقامة) لا ديني.', freq:'مكرر جداً — ظهر في نحو ٥ من النماذج المرسلة بنفس الصياغة الحرفية.'},
{type:'essay', q:'ما هي قواعد الانتقال بين الجنسية العثمانية والجنسية السورية؟', ans:'من أهم قواعد الانتقال بين الجنسية العثمانية والجنسية السورية أنه: يتم إعطاء حرية الاختيار للشخص بين اختيار الجنسية السورية أو الجنسية التركية؛ فأي شخص موجود على الإقليم السوري عند إعطائه حرية الخيار يتم إما أن يختار الجنسية السورية أو الجنسية التركية، وبالتالي إذا اختار الشخص الجنسية السورية فإنه يبقى في سوريا، أما إذا اختار الجنسية التركية يتوجب عليه أن يقوم بمغادرة الأراضي السورية خلال ١٢ شهراً (هذا البند منصوص عليه في اتفاقية لوزان وما زال مفعّلاً إلى يومنا هذا)، مع الإشارة إلى أنه عليه أن يختار خلال مهلة سنتين تبدأ من تاريخ ٣٠/٨/١٩٢٤ (تحت طائلة عدم قبول طلبه في الاختيار بعد انتهاء مدة السنتين). والنقطة الأهم هي أنه على الشخص بعد الخيار أن يقوم بنقل محل إقامته خلال ١٢ شهراً. وهنا الأولاد القُصّر يتبعون جنسية والدهم؛ بمعنى أنه إذا اكتسب الشخص الجنسية السورية وكان يوجد لديه أولاد قُصّر فإنهم يكتسبون جنسية والدهم، لكن عند بلوغهم سنّ الثامنة عشرة من عمرهم يكون لهم حرية الخيار بين الجنسية السورية أو الرجوع إلى الجنسية التركية.', basis:'اتفاقية لوزان.', example:'—', tip:'أرقام مهمة: مهلة الخيار سنتان من ٣٠/٨/١٩٢٤، ومهلة المغادرة ١٢ شهراً بعد الاختيار — قد تُسأل هذه التواريخ مباشرة.'},
{type:'tf', q:'من يولد من أب سوري وأم ألمانية على الأراضي الألمانية يكتسب الجنسية السورية والألمانية معاً.', correct:true, ans:'صح، فهو يكتسب الجنسية السورية بحكم الدم لأن أباه سوري متمتع فعلاً بجنسيته، أما الجنسية الألمانية فهذا الأمر يعود للقوانين المعمول بها في ألمانيا في هذا المجال (حق الإقليم).', basis:'—', example:'لو كانت أمه فرنسية وولد على أرض فرنسا، لاكتسب السورية والفرنسية معاً كذلك.', tip:'ركّز التعليل على أن كل جنسية تُكتسب وفق قانونها الخاص المستقل، لا وفق قاعدة موحّدة.', freq:'مكرر جداً — نفس السؤال يتكرر بتبديل الأم فقط (ألمانية / فرنسية / مصرية...)؛ التعليل واحد دائماً.'},
{type:'essay', q:'تكلم عن حق الدم والإقليم كأساس من أسس اكتساب الجنسية السورية الأصلية.', ans:'نصت الفقرة /أ/ب/ من المادة الثالثة من المرسوم التشريعي رقم ٢٧٦ لعام ١٩٦٩ على أنه يعتبر عربياً سورياً حكماً: (أ) من ولد لأب سوري في القطر أو خارجه (حق الدم)، (ب) من ولد في القطر من أم عربية سورية ولم تثبت نسبته لأبيه (حق الدم من ناحية الأم مقترناً بحق الإقليم). ويتبيّن من ذلك أن المشرع السوري قد قرر في هذه الحالة ثبوت الجنسية العربية السورية استناداً إلى حق الإقليم (الولادة في القطر السوري) وحق الدم من ناحية الأم (الولادة من أم عربية سورية).', basis:'المادة ٣/أ/ب من المرسوم التشريعي ٢٧٦ لعام ١٩٦٩.', example:'طفل وُلد في دمشق من أم سورية وأب مجهول (لم يثبت نسبه) يُعتبر سورياً بحق الدم من جهة الأم مع حق الإقليم معاً.', tip:'حالة الدم+الإقليم معاً هي الاستثناء الوحيد الذي تُكسب فيه الأم الجنسية بحق الدم لابنها — لا تخلط بينها وبين حق الدم المنفرد (وهو للأب فقط).', freq:'مكرر — سؤال بحثي أساسي في أغلب الدورات.'},
{type:'tf', q:'أخذ المشرع السوري فيما يتعلق بالجنسية الأصلية بحق الدم فقط.', correct:false, ans:'خطأ، أخذ المشرع السوري بالنسبة للجنسية الأصلية بحق الدم بصفة أساسية، والإقليم في ثلاث حالات: حق الدم منفردة، وحق الدم والإقليم معاً، وحق الإقليم منفردة، وكذلك الانتماء بالأصل للجمهورية العربية السورية في حالة منفردة.', basis:'—', example:'—', tip:'أربع حالات في الحقيقة إن أضفنا الانتماء بالأصل، لكن الأهم في الامتحان هو الثلاث الأساسية: دم، إقليم، دم+إقليم.'},
{type:'essay', q:'ما هي شروط اكتساب الجنسية السورية بموجب حقّ الدم؟', ans:'تثبت الجنسية العربية السورية للفرد المولود لأب عربي سوري بحكم القانون، سواء أتمّت ولادته داخل القطر أم خارجه، وسواء أكانت الأم وطنية أو أجنبية أم عديمة الجنسية، وفق الشروط التالية: ١- أن يكون الأب متمتعاً فعلاً بجنسية الجمهورية العربية السورية عند ولادة الطفل، أو وقت الوفاة إذا توفي الأب قبل الميلاد. فإذا كان الأب وقت الحمل أجنبياً ثم أصبح متمتعاً بالجنسية العربية السورية وقت الولادة أو قبلها، فإن المولود تثبت له الجنسية العربية السورية ولو كان الأب أجنبياً وقت الحمل. أما إذا كان الأب إذا كان أثناء الحمل متمتعاً بالجنسية العربية السورية، ولكنه فقدها وقت الميلاد أو قبله، فإنَّ المولود لا تثبت له الجنسية العربية السورية في هذه الحالة حتى ولو عاد الأب وأصبح عربياً سورياً بعد الميلاد. ولا يشترط أن يكون الأب مقيماً في القطر السوري. ٢- أن يثبت نسب المولود لأبيه وفقاً لأحكام النسب في القانون السوري، سواء أثبت النسب للمولود وقت الميلاد أم بعده. فإذا ثبت نسب المولود لأبيه بعد الميلاد بصورة قانونية فإنه يكتسب الجنسية العربية السورية من تاريخ ميلاده طالما أن أباه كان عربياً سورياً في هذا الوقت، حتى ولو اكتسب الولد جنسية أجنبية خلال الفترة ما بين الولادة وثبوت النسب لأن ثبوت النسب ينطوي بالنسبة للجنسية على أثر كاشف لا منشئ لها.', basis:'المادة ٣/أ من المرسوم التشريعي ٢٧٦ لعام ١٩٦٩.', example:'ولد وُلد لأب سوري وأثبت نسبه إليه بعد الولادة بسنوات، ثم أصبح خلال هذه الفترة يحمل جنسية أجنبية — تظل الجنسية السورية له من تاريخ الميلاد وليس من تاريخ ثبوت النسب.', tip:'نقطة "الأثر الكاشف لا المنشئ" لثبوت النسب هي نقطة امتحانية دقيقة تُسأل غالباً بشكل منفصل.'},
{type:'tf', q:'الابن المولود لأب سوري مقيم في ألمانيا يحق له طلب الجنسية السورية لدى البلوغ.', correct:false, ans:'خطأ؛ يكتسب الجنسية السورية بحكم الدم فوراً بمجرد الولادة، دون حاجة لإجراء طلب أو انتظار بلوغ سنّ الرشد، لأن الأب متمتع فعلاً بالجنسية السورية.', basis:'—', example:'—', tip:'هذا السؤال يختبر خلط شائع بين اكتساب الجنسية الأصلية (فوري وتلقائي) واكتسابها اللاحقة (يحتاج طلباً).'},
{type:'tf', q:'تكتسب الجنسية السورية بحكم الدم والإقليم من وُلد من أب سوري داخل سوريا أو خارجها.', correct:false, ans:'خطأ، بل يكتسب الجنسية السورية بحكم الدم فقط لأن والده سوري، سواء ولد داخل سوريا أو خارجها، فحق الدم من ناحية الأب لا يشترط له إقليم أصلاً.', basis:'—', example:'—', tip:'كلمة "الدم والإقليم" هي الفخ؛ الأب وحده يكفي دون اشتراط مكان الولادة.'},
{type:'tf', q:'من وُلد خارج القطر من أم سورية يكتسب الجنسية السورية بحكم الدم.', correct:false, ans:'خطأ، لا يكتسب الجنسية السورية من وُلد خارج القطر ولو كانت أمه سورية بحكم الدم، لأن اكتساب الجنسية بحكم الدم يقتصر على الأب دون الأم وفق قانون الجنسية السوري.', basis:'—', example:'—', tip:'هذا السؤال بالذات من أكثر الأسئلة تكراراً في جميع النماذج المرسلة — احفظ صيغته وعلّله جيداً.'},
{type:'essay', q:'ما هي حالات اكتساب الجنسية السورية بموجب حقّ الإقليم؟', ans:'حق الإقليم منفرداً يُكسِب الجنسية السورية الأصلية في الحالات التالية: ١- الأولاد المولودون في القطر السوري لأب وأم مجهولين. ٢- الأولاد المولودون في القطر السوري لأب معروف وأم معروفة ولكن لا جنسية لهما، أو أن لهما جنسية غير معروفة أو غير ثابتة بتاريخ ميلادهم. ٣- الأولاد الشرعيون الذين لم يستطيعوا عند ولادتهم اكتساب جنسية أجنبية استناداً إلى صلة النبوّة.', basis:'—', example:'طفل عُثر عليه في حلب ولا يُعرف والداه — يُعدّ سورياً حكماً بحق الإقليم.', tip:'ثلاث حالات، وكلها تشترك في وضعية "لقيط" أو "غموض جنسية الوالدين" — استخدم هذا الخيط لتذكرها.'},
{type:'essay', q:'ما هي شروط اكتساب الجنسية السورية بموجب حق الدم والإقليم معاً؟', ans:'يثبت الجنسية العربية السورية للفرد المولود لأب أجنبي لم تثبت نسبته إليه من أم عربية سورية وفق الشروط الآتية: ١- يجب أن تكون الأم سورية. ٢- أن تتمّ الولادة على الإقليم السوري. ٣- عدم ثبوت نسب الطفل لأبيه. فإذا تخلَّف أي شرط من هذه الشروط فإن المولود لا يكتسب الجنسية السورية.', basis:'المادة ٣/ب من المرسوم التشريعي ٢٧٦ لعام ١٩٦٩.', example:'وضعت الأم السورية مولودها في العراق، ولم يثبت نسب الطفل لأبيه؛ في هذه الحالة لا يكتسب المولود الجنسية السورية لأن الولادة تمّت خارج الإقليم السوري.', tip:'اذكر المثال العكسي (كالمثال المقابل) لتُثبت فهمك — هذا ما تفعله النماذج الفعلية في تعليلاتها.'},
{type:'tf', q:'يتم اكتساب الجنسية السورية بموجب حق الدم والإقليم معاً في حالة واحدة فقط.', correct:true, ans:'صح، وهي حالة أن يولد الطفل في القطر من أم عربية سورية ولم تثبت نسبته إلى أبيه.', basis:'—', example:'—', tip:'انتبه إن جاء السؤال بصيغة "في حالتين" فهو خطأ — الحالة واحدة فقط لهذا الأساس بالذات.'},
{type:'tf', q:'من وُلد وأبواه مجهولان في سوريا لا جنسية له.', correct:false, ans:'خطأ، يعدّ عربياً سورياً حكماً بحق الإقليم لأنه ولد في القطر السوري لأب وأم مجهولين، دون الحاجة إلى إجراء أي طلب لإثبات جنسيته.', basis:'—', example:'—', tip:'هذا اللقيط تحديداً هو الحالة الأولى من حالات حق الإقليم المنفرد — احفظ صيغتها.'},
{type:'essay', q:'ما الفرق بين مجهول الجنسية ومن لا جنسية له؟', ans:'يُقصد بالمولود لأبوين مجهولي الجنسية، الولد الشرعي لأبوين معروفين يتمتعان بجنسية ما ولكنها غير معلومة. أما المولود لأبوين لا جنسية لهما فهو المولود الشرعي أيضاً لأبوين معروفين ولكنهما لا يتمتعا بأية جنسية (عديمي الجنسية).', basis:'—', example:'شخص يُعرف أنه بريطاني الأصل لكن لا تُعرف بالضبط جنسيته الحالية = مجهول الجنسية. أما شخص فقد جنسيته الأصلية بالكامل ولم يكتسب أخرى = عديم الجنسية.', tip:'الفرق الدقيق: "مجهول" = له جنسية لكن غير معروفة، "لا جنسية له" = ليس له جنسية أصلاً (عديم الجنسية).'},
{type:'tf', q:'شخص وُلد في لبنان من أم سورية ولم يثبت نسبه لأبيه، يكتسب الجنسية السورية حكماً.', correct:false, ans:'خطأ، من أجل اكتساب الجنسية السورية يجب أن تتم الولادة على الأراضي السورية ولم يثبت النسب لأبيه؛ هنا اكتسب الجنسية بناء على حق الدم والإقليم، ولمّا حصلت الولادة خارج القطر السوري (في لبنان) فلا تثبت له الجنسية السورية حكماً.', basis:'—', example:'—', tip:'صيغة شائعة جداً في الامتحانات — دائماً تحقق من مكان الولادة أولاً في هذا النوع من الأسئلة.'},
{type:'tf', q:'شخص وُلِد في سورية من أم عربية وأبوه عديم الجنسية، فإنه يكتسب الجنسية السورية بحق الدم.', correct:false, ans:'خطأ، لا يكتسب الجنسية السورية استناداً إلى حق الدم استناداً إلى قوة الدم من الأم فحسب، لكن يمكن أن يكتسبها بحق الدم والإقليم معاً إذا لم تثبت نسبته إلى أبيه.', basis:'—', example:'—', tip:'إن كان الأب عديم الجنسية ونُسب إليه الطفل فعلاً فهو يتبع أباه، أما إن لم يثبت النسب فحينها فقط يُنظر إلى حق الدم من الأم + الإقليم.'},
{type:'essay', q:'هل يؤدي تحقق الشروط المطلوبة في طالب التجنس إلى منحه الجنسية العربية السورية تلقائياً؟', ans:'لا، لا يؤدي تحقق الشروط المطلوبة في طالب التجنس إلى منحه الجنسية بمجرد طلبها، بل لا بدّ من موافقة الدولة على ذلك، ولها أن تمنحها أو لا تمنحها؛ والأمر يخضع لتقديرها المطلق، فإذا اقترن طلب التجنس بالإيجاب من قبل الوزير تتولى الوزارة تنظيم مشروع مرسوم بمنح الجنسية لطالبها، وترفعه إلى السيد رئيس الجمهورية. وبموجب المادة ٢٦ من قانون الجنسية العربية السورية يكتسب المتجنس الجنسية اعتباراً من تاريخ صدور هذا المرسوم بتوقيع رئيس الجمهورية لا من تاريخ نشره.', basis:'المادة ٢٦ من قانون الجنسية العربية السورية.', example:'—', tip:'الخلاصة المهمة: "التجنس منحة من الدولة وليس حقاً للفرد" — احفظ هذه الجملة حرفياً فهي مفتاح عدة أسئلة.'},
{type:'essay', q:'ما هي شروط تجنّس الأجنبي وفق القانون السوري؟', ans:'يجوز منح الأجنبي الجنسية بمرسوم على اقتراح الوزير وبناء على طلب خطي يقدمه الطالب، يُشترط في الطالب أن يكون: أ- كامل الأهلية. ب- مقيماً في القطر إقامة متتالية مدة خمس سنوات على الأقل سابقة لتقديم الطلب، وتعتبر الإقامة المتقطعة متتالية إذا لم تتجاوز مدة غياب صاحبها كاملة زيادة على الخمس سنوات. ج- خالياً من الأمراض السارية والعاهات والعلل التي تمنعه من مزاولة أي عمل. د- حسن السلوك محمود السمعة، ولم يسبق الحكم عليه بعقوبة جنائية أو بعقوبة مقيدة للحرية في جريمة شائنة إلا إذا رُدّ إليه اعتباره. هـ- ذا اختصاص أو خبرة يمكن الاستفادة منها في القطر، أو أن تكون له وسيلة مشروعة للكسب أو يملك ما يغنيه عن مساعدة الغير. و- ملماً باللغة العربية قراءة وكتابة.', basis:'—', example:'—', tip:'الشروط الستة (أ-و) يمكن أن تأتي كسؤال منفصل أو ضمن سؤال صح/خطأ عن أحدها فقط — احفظها بترتيب الحروف.'},
{type:'tf', q:'يُشترط في طالب التجنس أن يكون كامل الأهلية وفق قانونه الوطني عند تقديمه الطلب.', correct:false, ans:'خطأ، يُشترط في طالب التجنس الأجنبي أن يكون كامل الأهلية وفق القانون السوري وليس وفق قانونه الوطني. ولقد عرّف المشرع السوري كامل الأهلية في المادة ٤٦ من القانون المدني السوري بأنه كل شخص بلغ سنَّ الرشد متمتعاً بقواه العقلية ولم يُحجر عليه، وسنّ الرشد هي ثماني عشرة سنة ميلادية كاملة.', basis:'المادة ٤٦ من القانون المدني السوري.', example:'—', tip:'احفظ نصّ تعريف الأهلية الكاملة من المادة ٤٦ لأنه ورد حرفياً في أحد النماذج.'},
{type:'essay', q:'ما هي حالات التجنس الاستثناني في القانون السوري؟', ans:'أجاز المشرع السوري في المادة السادسة من المرسوم التشريعي ٢٧٦ لعام ١٩٦٩ منح جنسية الجمهورية العربية السورية دون التقيد بشروط التجنس العادية إلى الفئات التالية من الأشخاص: ١- المواطنون المغتربون. ٢- الأشخاص الذين أدوا للدولة أو للأمة العربية خدمات جليلة. ٣- المنتمون بأصلهم إلى إحدى البلاد العربية.', basis:'المادة السادسة من المرسوم التشريعي ٢٧٦ لعام ١٩٦٩.', example:'—', tip:'من أكثر أسئلة الدورات تكراراً على الإطلاق — يُطلب أحياناً بلفظ "استثنائي" وأحياناً "بدون التقيد بشروط التجنس العادية"؛ نفس الجواب.', freq:'مكرر جداً — سؤال بحثي شبه مضمون.'},
{type:'essay', q:'ما هي شروط منح الجنسية السورية للمواطن المغترب؟', ans:'١- أن يكون الشخص حائزاً على شهادة مواطن مغترب، ويتفرّع عن هذا الشرط شرطان: أ. أن يكون منتمياً بأصله إلى بلد عربي، ولا يقيم في أية دولة عربية ولا يحمل جنسية أية دولة منها. ويعد الشخص منتمياً في الأصل إلى بلد عربي إذا كان أحد أصوله لأبيه مولوداً في بلد عربي. ب. غير منتمٍ لأي حزب سياسي أو جمعية أو ناد يناوئ الاتجاه القومي، ولم يقم بأي نشاط معادٍ للأمة العربية سواء أكان ذلك داخل البلاد أو خارجها، وذلك لكي يكون جديراً بحمل لقب مواطن مغترب، لأنه يفترض فيه أن يعمل لمصلحة الأمة العربية لا ضدها. ٢- أن يقدم بطلب خطي يعبّر فيه صراحة عن رغبته في اكتساب جنسية الجمهورية العربية السورية.', basis:'—', example:'—', tip:'انتبه لصياغة الفرق بين "منتمٍ بأصله" (شرط شهادة المغترب) و"غير منتمٍ لحزب مناوئ" — كثيراً ما يُخلط بين الاثنين في أسئلة الصح والخطأ.'},
{type:'tf', q:'تترتب الجنسية العربية السورية حكماً لكل من يحمل شهادة مواطن مغترب.', correct:false, ans:'خطأ، لا تترتب الجنسية السورية حكماً لكل من يحمل شهادة مواطن مغترب، بل لا بدّ أيضاً أن يقترن الطلب بالموافقة؛ لأن السلطة التنفيذية ليست ملزمة بالموافقة على ذلك، فإن شاءت منحته إياها وإن شاءت حجبتها عنه. ويتمّ منح الجنسية العربية السورية في هذه الحالة بمرسوم جمهوري بناء على اقتراح وزير الداخلية. ويُعدّ المواطن المغترب متمتعاً بالجنسية العربية السورية اعتباراً من تاريخ صدور مرسوم المنح.', basis:'—', example:'—', tip:'نفس فكرة "التجنس منحة لا حق" تتكرر هنا أيضاً — هي فكرة جوهرية تعبر عن كامل باب التجنس.'},
{type:'tf', q:'الأشخاص الذين أدوا للدولة أو للأمة العربية خدمات جليلة يكتسبون الجنسية السورية حكماً.', correct:false, ans:'خطأ، إن الجنسية العربية السورية تُمنح لمثل هؤلاء على سبيل التكريم والتقدير والعرفان بالجميل، وغالباً ما يتم استمزاج رأيهم واستطلاع رأيهم قبل تنظيم مرسوم منحهم الجنسية، فهي لا تفرض عليهم فرضاً، كما لا يشترط لاكتسابها تقديم طلب بذلك من قبل صاحب الشأن.', basis:'—', example:'—', tip:'فخ دقيق: لا يُشترط طلب خطي هنا (بخلاف حالة المغترب) لأنها تكريم وليست استجابة لرغبة.'},
{type:'tf', q:'يكتسب الجنسية السورية حكماً من ينتمي بأصله إلى أحد البلاد العربية.', correct:false, ans:'خطأ، يشترط لمنح الجنسية في هذه الحالة، إضافة إلى شرط الانتماء بالأصل، أن يتقدم من ينطبق عليه هذا الوصف بطلب يعبّر فيه عن رغبته باكتساب الجنسية العربية السورية. ولا بد من صدور مرسوم بمنحها بناء على اقتراح وزير الداخلية الذي يعود له تقدير الأسباب التي تبرر ذلك.', basis:'—', example:'—', tip:'يشترك مع حالة "المغترب" في أنه يحتاج طلباً، بخلاف حالة "أدى خدمات جليلة" التي لا تحتاج طلباً.'},
{type:'tf', q:'يُعفى أبناء البلدان العربية من شرط الإقامة لاكتساب الجنسية العربية السورية.', correct:true, ans:'صح، حيث استلزم المشرع أن تكون إقامة العربي المتقدم لطلب التجنس هي إقامة عادية أي موطنه في القطر السوري عند تقديم الطلب، غير أنه لم يشترط مدة معينة لهذه الإقامة.', basis:'—', example:'—', tip:'الإعفاء من "مدة معينة" وليس من الإقامة كلياً — تبقى الإقامة العادية شرطاً، لكن بلا مدة محددة.'},
{type:'tf', q:'يُعفى أبناء البلدان العربية من شرط الإلمام باللغة العربية لاكتساب الجنسية العربية السورية.', correct:true, ans:'صح، لأنه يفترض بأبناء البلدان العربية الإلمام بالعربية ليس الإلمام فحسب وإنما إتقانها أيضاً.', basis:'—', example:'—', tip:'التعليل بالضبط هو "الافتراض" وليس "الإعفاء التشريعي الصريح" — تنبّه لهذا الفارق في صياغة التعليل.'},
{type:'essay', q:'ابحث في شروط اكتساب المرأة العربية الجنسية العربية السورية عن طريق الزواج.', ans:'أُعفيت المرأة العربية من شرط استمرار الزوجية مدة سنتين ومن شرط الإقامة خلال هذه المدة، واكتُفي لها بالشروط التالية: ١- أن تكون متمتعة بجنسية بلد عربي أو من أصل سوري وتتمتع بالجنسية العربية السورية. ٢- أن تقدم طلباً خطياً تبين فيه رغبتها الدخول في جنسية زوجها. ٣- أن يصدر قرار من وزير الداخلية بمنحها الجنسية، وتكتسب الزوجة الجنسية اعتباراً من تاريخ تقديمها الطلب وليس من تاريخ قرار الوزير. ٤- أما بالنسبة لشرط صحة عقد زواجها، فلا بد في هذه الحالة أن يكون صحيحاً من حيث الموضوع ووفقاً لأحكام الزواج في القانون السوري، عملاً بالمادة ١٥ من القانون المدني التي تقضي بأنه إذا كان أحد الزوجين سورياً وقت الزواج فالقانون السوري وحده يسري، فالقانون السوري فلابد أن يكون الزوج سوري وقت الزواج، فلابد أن يكون عقد الزواج صحيحاً وفقاً للقانون السوري.', basis:'المادة ١٥ من القانون المدني السوري.', example:'زوجة أردنية تزوجت من سوري وقدّمت طلباً خطياً وصدر قرار وزير الداخلية بمنحها الجنسية — تكتسبها من تاريخ الطلب لا من تاريخ القرار.', tip:'هذا السؤال البحثي بالذات ظهر بصيغته الحرفية في أكثر من دورة (٢٠٢٤ نظامي، ٢٠٢٣ نظامي) — احفظه كاملاً كنص جاهز.', freq:'مكرر جداً — من أكثر الأسئلة البحثية المضمونة في الامتحان.'},
{type:'tf', q:'المرأة السورية التي تتزوج من أردني يكسبها القانون السوري جنسية زوجها الأردنية بقوة القانون.', correct:false, ans:'خطأ، لأن هذا الأمر يتعلق بإرادة الدولة الأجنبية وبأحكام قوانينها فيها، ولا يد للتشريع السوري فيه.', basis:'—', example:'—', tip:'هذا يظهر بصيغ متعددة (زوج عراقي، مصري، أردني...) لكن نفس التعليل يُطبَّق دوماً.', freq:'مكرر — نفس السؤال بتبديل جنسية الزوج فقط في أكثر من نموذج.'},
{type:'tf', q:'تكتسب المرأة الأجنبية الجنسية السورية في حال زواجها من سوري، من تاريخ تقديمها طلب التجنس.', correct:false, ans:'خطأ، لا تكتسب المرأة الأجنبية الجنسية العربية السورية، إلا اعتباراً من تاريخ صدور قرار وزير الداخلية بمنحها الجنسية، وليس من تاريخ الطلب أو من تاريخ الزواج.', basis:'—', example:'—', tip:'قارن هذا مع الزوجة العربية (تكتسب من تاريخ الطلب) — الفارق بينهما محور امتحاني أساسي.'},
{type:'essay', q:'الزوجة الأجنبية التي تتزوج من أجنبي، اكتسبت لاحقاً الجنسية السورية، يُشترط لدخولها في الجنسية السورية أن يكون عقد الزواج صحيحاً بموجب القانون السوري. صح أم خطأ مع التعليل.', ans:'صح، إذ يشترط المشرع السوري صحة عقد الزواج وثبوته أصولاً وفق قانون الأحوال الشخصية السورية، كشرط موضوعي لاعتباره سبباً قانونياً صحيحاً لترتيب آثار الجنسية وكسبها.', basis:'—', example:'—', tip:'الصياغة تجمع بين موضوعين: صحة عقد الزواج + ترتيب آثار الجنسية — اربطهما في الجواب دوماً.'},
{type:'essay', q:'ما هي شروط فقدان المرأة العربية السورية الجنسية بزواجها من أجنبي؟', ans:'١- أن تعلن رغبتها في اكتساب جنسية زوجها بطلب خطي يثبت ذلك سواء عند الزواج أم خلال قيام رابطة الزوجية. ٢- أن يسمح قانون زوجها بدخولها في جنسيته وذلك كي لا تصبح المرأة الوطنية عديمة الجنسية إذا فقدت جنسيتها دون أن تتمكن من اكتساب جنسية زوجها الأجنبية. ٣- أن يكون عقد زواج المرأة السورية بالأجنبي صحيحاً وفقاً لأحكام صحة الزواج في القانون السوري، وذلك عملاً بالمادة ١٥ من القانون المدني التي تقضي بأنه إذا كان أحد الزوجين سورياً وقت الزواج فالقانون السوري وحده يسري.', basis:'المادة ١٥ من القانون المدني السوري.', example:'سورية تزوجت أميركياً وأعلنت رغبتها بالتجنس بجنسيته، لكن القانون الأميركي لا يمنحها الجنسية تلقائياً بالزواج — فهي تفقد السورية فقط إذا فعلاً سمح لها قانون زوجها بالدخول في جنسيته.', tip:'الشرط الثاني (سماح قانون الزوج) هو الأهم لمنع انعدام الجنسية — يظهر بشكل منفصل كسؤال أحياناً.'},
{type:'tf', q:'زواج المرأة السورية من فرنسي يجعلها تفقد الجنسية السورية.', correct:false, ans:'خطأ، تحتفظ المرأة السورية التي تتزوج من أجنبي بجنسيتها السورية إلا إذا طلبت اكتساب جنسية زوجها وكانت فعلاً بموجب قانونه، وإذا كان عقد الزواج باطلاً وفقاً لأحكام القانون السوري الناظم لعقد الزواج، فإنها تظل متمتعة بجنسيتها.', basis:'—', example:'—', tip:'الأصل: الاحتفاظ بالجنسية، والاستثناء هو الفقدان بشروطه الثلاثة مجتمعة.'},
{type:'tf', q:'إذا أقدمت سورية مسلمة على الزواج من مسيحي فرنسي واكتسبت جنسية زوجها، فهل يحق لها أن تطالب بفقدان الجنسية السورية؟', correct:false, ans:'لا، يحق لها ذلك لأن ذلك يحق لها ذلك ولا أثر له على فقدان الجنسية، وذلك لأن عقد الزواج باطل، وذلك لأن الزواج باطل وفق القانون السوري الناظم لأحكام الأحوال الشخصية (زواج المسلمة من غير مسلم باطل)، وبالتالي لا يتحقق شرط صحة عقد الزواج المطلوب لفقدان الجنسية.', basis:'—', example:'—', tip:'هذا مثال دقيق على تطبيق شرط "صحة عقد الزواج وفق القانون السوري" — الزواج الباطل يمنع ترتيب أي أثر على الجنسية.'},
{type:'essay', q:'ما هي شروط فقدان العربي السوري جنسيته بسبب اكتسابه جنسية أجنبية؟', ans:'يشترط لفقدان العربي السوري جنسيته العربية السورية في حال اكتساب جنسية أجنبية ما يلي: ١- أن يقدم طلباً خطياً يعبّر فيه عن رغبته الصريحة بالتخلي عن جنسيته العربية السورية بقصد التجنس بجنسية أجنبية. ٢- أن يأذن له بالتخلي عن الجنسية العربية السورية مرسوم يصدر عن رئيس الجمهورية بناء على اقتراح وزير الداخلية. ٣- أن يكتسب طالب التخلي الجنسية الأجنبية بموجب قوانين الدولة الأجنبية بصورة فعلية، وعلى ألا يعتبر مجرد تقديم طلب من صاحب العلاقة إلى الدولة الأجنبية يناشدها فيه أن تمنحه جنسيتها محققاً لفقد العربي السوري جنسيته ولو كان قد أذن له بالتخلي.', basis:'—', example:'—', tip:'الشرط الثالث دقيق جداً: مجرد تقديم الطلب للدولة الأجنبية لا يكفي — لا بدّ من الاكتساب الفعلي.'},
{type:'tf', q:'عدم السماح للعربي السوري بالتخلي عن جنسيته يمنعه من اكتساب جنسية أجنبية.', correct:false, ans:'خطأ، لأن التجنس بجنسية أجنبية لا يتوقف على إذن السلطات السورية؛ عدم أذن الدولة السورية للعربي السوري بالتخلي عن جنسيته لا يحول دون اكتسابه جنسية أجنبية وفقاً لقوانين الدولة الأجنبية ولو كان ذلك ولو كان اكتسابه لها إطلاقاً دون اكتسابه دون أذن السماح للعربي السوري بالتخلي عن جنسيته بالتخلي.', basis:'—', example:'عربي سوري لم يؤذن له بالتخلي، تجنّس بالجنسية الأميركية فعلياً — يبقى محتفظاً بجنسيته السورية أيضاً (يصبح مزدوج الجنسية) دون اعتداد القانون السوري بذلك التخلي.', tip:'الفكرة: عدم السماح لا يمنع الاكتساب الأجنبي، لكنه يمنع فقط الاعتداد بترتب أثر فقدان الجنسية السورية.'},
{type:'essay', q:'ما الفرق بين سحب الجنسية وإسقاطها؟', ans:'تُقرر الدول لنفسها حقّ سحب جنسيتها من الشخص الأجنبي الذي اكتسبها بصورة لاحقة على الميلاد (بالتجنس والزواج)، وذلك خلال فترة معينة من دخوله فيها، إذا أتى عملاً يدل على عدم اندماجه في مجتمع الدولة، أو على عدم ولائه لها أو على عدم جدارته بحمل جنسيتها. والإسقاط على خلاف السحب يمكن أن توقعه الدولة بحق الشخص سواء أكانت جنسيته أصلية أم مكتسبة وفي أي وقت كان. وتختلف أسباب إسقاط الجنسية من دولة إلى أخرى، غير أنّ أهم الحالات التي تلجأ فيها الدولة إلى الإسقاط هي ارتباط الوطني بدولة أجنبية عن طريق الإقامة على إقليمها أو العمل في إدارتها أو في جيشها بشكل يتعارض مع مصالح دولته.', basis:'—', example:'—', tip:'الفارق الجوهري: السحب = فقط للمتجنسين حديثاً وضمن فترة محددة. الإسقاط = يطال الأصلي والمكتسب وفي أي وقت.'},
{type:'essay', q:'ما هي طبيعة استرداد الجنسية؟ وما هي طبيعة ردّ الجنسية؟', ans:'الاسترداد هو حقّ للشخص، وليس منحة من الدولة، وهذا ما أخذ به المشرع السوري خاصة بالنسبة للزوجة والأولاد، فهؤلاء يجوز لهم استرداد جنسيتهم. بينما الرد ليس من حق الشخص، بل منحة من الدولة، فمسألة رد الجنسية مسألة متعلقة بالسلطة التقديرية للدولة.', basis:'—', example:'—', tip:'"الاسترداد حق" مقابل "الرد منحة" — عبارة مفتاحية يجب حفظها كما هي.'},
{type:'tf', q:'أقدم شخص على ارتكاب جريمة مخلة بأمن الدولة وتم تجريده من جنسيته، هل يحق له استرداد جنسيته؟', correct:false, ans:'لا، ليس من حقه استرداد الجنسية؛ لأنه فقدها بالتجريد، لكن يجوز للدولة وفقاً لسلطتها التقديرية أن ترُدّ له الجنسية.', basis:'—', example:'—', tip:'هذا يربط مباشرة بين "التجريد" و"الرد" (لا "الاسترداد") — فخ مصطلحي متكرر جداً.'},
{type:'tf', q:'لا يوجد فرق بين فقدان الجنسية بالتغيير وفقدان الجنسية بالتجريد.', correct:false, ans:'خطأ، بموجب قانون الجنسية السورية الحالي يمكن للفرد أن يفقد جنسيته إما بسبب إرادي (بالتغيير أو التخلي)، وإما بسبب تأديبي على سبيل الجزاء (بالتجريد). كما يحق لمن فقد جنسيته بالتغيير المطالبة باستردادها، أما من فقدها بالتجريد فيحق له الرد لا الاسترداد، والرد منحة من الدولة وليس حقاً للفرد.', basis:'—', example:'—', tip:'هذا السؤال بالضبط ورد حرفياً في أحد النماذج المرسلة (سؤال ٣ في نموذج ٢٠٢٣/١٠/١) — احفظه كاملاً.', freq:'مكرر — ظهر في أكثر من نموذج بصياغات متقاربة.'},
{type:'essay', q:'ما هي حالات فقدان الجنسية العربية السورية بالتغيير؟', ans:'يفقد العربي السوري جنسيته بإرادته إما بسبب اكتسابه جنسية أجنبية، وإما بمفعول الزواج، وإما برجوعه عنها إلى جنسيته الأجنبية الأصلية السابقة.', basis:'—', example:'—', tip:'ثلاث حالات فقط، وكلها تشترك في كونها إرادية بخلاف التجريد.'},
{type:'tf', q:'التجريد القضائي هو الأصل في قانون الجنسية السوري.', correct:false, ans:'خطأ، التجريد الإداري هو الأصل، إذ يشمل سبع حالات، بينما ينحصر التجريد القضائي بحالة واحدة.', basis:'—', example:'—', tip:'عدد الحالات هو الحجة الحاسمة في التعليل: ٧ إدارية مقابل ١ قضائية فقط.'},
{type:'essay', q:'كيف يتم التجريد القضائي وفقاً لقانون الجنسية السوري؟ وما هي حالة التجريد القضائي التي نصّ عليها القانون رقم ٢٧٦ لعام ١٩٦٩؟', ans:'نصت المادة ٢٠ من الجنسية السورية على ما يلي: "يُجرَّد من الجنسية السورية العربية بحكم قضائي من يثبت اكتسابه لهذه الجنسية بناء على بيان كاذب أو بطريق التدليس". ومن الواضح أن حكم هذه المادة يشمل المتجنس بشكل عام سواء كان أجنبياً أم عربياً، إذا قدّم معلومات غير صحيحة، أو سكت عمداً عن واقعة أو ملابسة، أو قدّم أوراقاً، أو وثائق، أو شهادات مزورة لإثبات الشروط المطلوبة لتجنسه، بهدف تسهيل دخوله في الجنسية العربية السورية. ولا بد في هذه الحالة من أجل إعمال نص المادة (٢٠) ولصدور الحكم بالتجريد من: ...', basis:'المادة ٢٠ من قانون الجنسية العربية السورية (المرسوم ٢٧٦ لعام ١٩٦٩).', example:'شخص قدّم شهادة ميلاد مزورة تثبت ولادة أحد أصوله في سوريا للحصول على الجنسية بطريق الانتماء بالأصل — إذا انكشف التزوير يُجرَّد قضائياً.', tip:'هذا السؤال حرفي وثابت في كل دورة — احفظ نص المادة ٢٠ كاملاً حرفياً، فهو غالباً يُطلب نصاً وليس فكرة فقط.', freq:'مكرر — ظهر أكثر من مرة بصيغة مباشرة "كيف يتم التجريد القضائي".'},
{type:'tf', q:'الحكم بالتجريد القضائي من الجنسية جوازي للمحكمة.', correct:false, ans:'خطأ، إذا ثبت للمحكمة اكتساب الجنسية استناداً إلى بيان كاذب أو بطريق التدليس فإنه يتوجب عليها الحكم بالتجريد، إذ ليس لها في هذا الشأن أية سلطة تقديرية في تقرير هذا التدبير أو عدمه.', basis:'—', example:'—', tip:'وجوبي وليس جوازي — كلمة الفخ الرئيسية في هذا السؤال هي "جوازي".'},
{type:'essay', q:'من هي المحكمة المختصة بالتجريد القضائي من الجنسية؟ وما هي المدة التي يُمكن خلالها الحكم بالتجريد القضائي، ومتى يبدأ سريانها؟', ans:'المحكمة صاحبة الولاية بالنظر في جرم البيان الكاذب هي محكمة بداية الجزاء. وتتحرك دعوى التجريد من قبل النيابة العامة بناء على طلب الإدارة المعنية تبعاً للدعوى الجزائية. ولأنّ التجريد يتم لارتكاب جريمة يعاقب عليها القانون بعقوبة جنحية، فهي تخضع لمدة التقادم التي ينص عليها قانون العقوبات لأمثال هذه الجرائم وهي ثلاث سنوات، تبدأ من تاريخ وقوع الجريمة بالنسبة لتقديم البيان الكاذب، ومن تاريخ انكشاف حيل صاحب المصلحة بالنسبة للتدليس.', basis:'—', example:'—', tip:'التمييز الدقيق: نقطة بداية التقادم تختلف باختلاف نوع الجرم (كاذب: من الوقوع، تدليس: من الانكشاف).'},
{type:'tf', q:'لا يجوز تجريد المواطن السوري من جنسيته بحكم قضائي إلا على الشخص الذي اكتسب الجنسية بصورة لاحقة للميلاد سواء بالتجنس أو بالزواج.', correct:true, ans:'صح؛ لأن التجريد بحكم قضائي لا يطبق إلا على الشخص الذي اكتسب الجنسية الجنسية لاحقة للميلاد سواء بالتجنس أو الزواج، إذ ليس لها في هذا الشأن أية سلطة تقديرية في تقرير هذا التدبير.', basis:'—', example:'—', tip:'التجريد القضائي لا يُطبق على من اكتسب الجنسية الأصلية (بالدم أو الإقليم) بل فقط على المتجنس أو من اكتسبها بالزواج.'},
{type:'essay', q:'ما هي حالات التجريد الإداري وفقاً لقانون الجنسية السوري؟', ans:'يمكن أن يُجرَّد العربي السوري من جنسيته بمرسوم معلَّل بناء على اقتراح من وزير الداخلية في سبع حالات هي: ١- تجنس المواطن العربي السوري بجنسية أجنبية قبل السماح له بالتخلي عن جنسيته. ٢- دخول المواطن العربي السوري باختياره في الخدمة العسكرية لدى دولة أجنبية دون ترخيص سابق. ٣- الاستخدام لدى دولة أجنبية بأية صفة كانت. ٤- النشاط والعمل لصالح بلد هو في حالة حرب مع القطر السوري. ٥- مغادرة البلاد بصورة غير مشروعة إلى بلد هو في حالة حرب مع القطر السوري. ٦- ما يتعلق بمصلحة أمن البلاد وسلامتها. ٧- مغادرة البلاد نهائياً بقصد الاستيطان في بلد غير عربي.', basis:'—', example:'—', tip:'السؤال الأكثر تكراراً على الإطلاق في هذه المادة — رتّب الحالات السبع بالترقيم كي لا تنسى واحدة.', freq:'مكرر جداً — سؤال بحثي ثابت تقريباً في نصف النماذج المرسلة.'},
{type:'tf', q:'يجوز تجريد المواطن العربي السوري الذي يدخل باختياره في الخدمة العسكرية لدى دولة أجنبية دون ترخيص سابق ضمن شروط معينة، ما هي؟', ans:'أن يكون المواطن العربي السوري قد دخل باختياره في الخدمة العسكرية لدى دولة أجنبية وعلى ذلك لا يجوز تجريده منها جبراً عنه، ويراد بالخدمة العسكرية الخدمة بصفة عسكري نظامي في جيش تابع لدولة أجنبية.', correct:true, ans2:'صح — بشرط أن يكون الدخول اختيارياً، وأن يكون بصفة عسكري نظامي، وألا يكون قد حصل على ترخيص مسبق من وزير الدفاع، فإذا سبق أن حصل على ترخيص من وزير الدفاع وأذن له وزير الدفاع بذلك قبل الدخول فيها، فلا محال لأعمال النص وتجريده من جنسيته، وذلك لانتفاء ممرات التجريد القائمة على أساس انتفاء الولاء والإخلال بالالتزامات الوطنية وعدم الامتثال لرغبة السلطة العامة.', ans:'صح — بشرط أن يكون الدخول اختيارياً، وأن يكون بصفة عسكري نظامي، وألا يكون قد حصل على ترخيص مسبق من وزير الدفاع؛ فإذا سبق أن حصل على ترخيص وأذن له بذلك قبل الدخول فيها، فلا محل لإعمال النص وتجريده من جنسيته.', basis:'—', example:'قوات ثورية غير نظامية لا تدخل في مفهوم الخدمة التي رتب عليها المشرع وجوب تجريد المواطن من جنسيته، بل لا بد من الدخول فعلاً في الخدمة العسكرية النظامية.', tip:'هذا السؤال وارد حرفياً في نموذج امتحان فعلي — لاحظ التمييز بين الجيش النظامي والقوات الثورية غير النظامية.'},
{type:'tf', q:'النشاط والعمل لصالح بلد هو في حالة حرب مع سوريا يُبرِّر التجريد القضائي من الجنسية.', correct:false, ans:'خطأ، النشاط والعمل لصالح بلد هو في حالة حرب مع القطر السوري هو إحدى حالات التجريد الإداري (وليس القضائي) بمرسوم معلَّل بناء على اقتراح وزير الداخلية.', basis:'—', example:'—', tip:'خلط شائع بين "إداري" و"قضائي" — التجريد القضائي محصور فقط بحالة البيان الكاذب أو التدليس.'},
{type:'essay', q:'ما هي شروط التجريد من الجنسية بالنسبة لمن يغادر البلاد نهائياً بقصد الاستيطان في بلد غير عربي؟', ans:'١- أن يغادر المواطن العربي السوري القطر نهائياً بقصد الاستيطان في بلد غير عربي. ٢- أن يكون قد استوطن في بلد أجنبي غير عربي، سواء حصل على جنسية هذا البلد أم لم يحصل عليها، أما إذا تمّ الاستيطان في بلد عربي فلا يستكمل التجريد شروطه. ٣- ألا تتجاوز غيبته خارج البلاد مدة ثلاث سنوات، لا فرق لأن أمضى هذه المدة في بلد الاستيطان أم في عدة بلاد أجنبية أخرى، على أن يكون هذا الغياب مقترناً بنية الاستيطان التي يُستدل عليها من ظروف الحال. ٤- أن تقوم وزارة الداخلية بإخطاره بالعودة إلى القطر خلال ثلاثة أشهر من تاريخ تبليغه الإخطار وأن يرفض الامتثال لهذا الإخطار خلال هذه المدة، وذلك إما بعدم الرد أو بالرد بأسباب غير مقنعة.', basis:'—', example:'—', tip:'الشرط الأول (استيطان بلد غير عربي) هو المحوري — لو استوطن بلداً عربياً لا تنطبق هذه الحالة إطلاقاً.'},
{type:'tf', q:'النشاط والعمل لصالح بلد هو في حالة حرب مع سوريا يُبرِّر التجريد القضائي.', correct:false, ans:'خطأ، النشاط والعمل لصالح بلد في حالة حرب هو من حالات التجريد الإداري وليس القضائي، فهو إحدى الحالات السبع، ويكون التجريد بمرسوم معلَّل بناء على اقتراح وزير الداخلية.', basis:'—', example:'—', tip:'تكرار مقصود لتثبيت الفرق بين الإداري والقضائي — يُعتبر من أكثر النقاط اختباراً.'},
{type:'essay', q:'ما هي شروط استرداد الجنسية السورية لأولاد القصّر الذين فقدوها بسبب تجنس أبيهم السوري بجنسية أجنبية واكتسبوا جنسيتهم الجديدة بالتبعية؟', ans:'يشترط ما يلي: أن يكونوا قد بلغوا سنّ الرشد وفقاً لقانون الجنسية السوري، وأن يعلن اختياره للجنسية السورية بطلب أصولي خلال سنة من تاريخ بلوغه سنّ الرشد، وأن تكون إقامته العادية في القطر، وأن يكون قد عاد إليه بقصد الإقامة الدائمة إذا كان قد غادره إلى خارج البلاد، وأن يسمح له وزير الداخلية باسترداد جنسيته بقرار يصدر عنه.', basis:'—', example:'—', tip:'مدة سنة واحدة من بلوغ سنّ الرشد — هذا الرقم دقيق يُسأل عنه أحياناً بشكل منفصل.'},
{type:'tf', q:'إذا استردّت المرأة السورية جنسيتها بعد وفاة زوجها فإن أولادها القصّر يتبعون جنسية والدهم ووالدتهم.', correct:false, ans:'خطأ، إذا استردّت المرأة السورية جنسيتها بعد وفاة زوجها فإن أولادها القصّر يتبعون جنسية والدهم ووالدتهم، على أن يبقى لهم حقّ الرجوع إلى جنسيتها خلال السنة التالية من تاريخ بلوغهم لسنّ الرشد وبقرار من الوزير.', basis:'—', example:'—', tip:'هذا سؤال معكوس عمداً — الصيغة الأصلية "خطأ" في الامتحان تتضمن نفس نص "صح" لكن بإضافة "لا يبقى لهم حق الرجوع" فتنقلب لخطأ؛ تأكد من قراءة كامل الصيغة قبل الإجابة.'},
{type:'essay', q:'كيف تسترد المرأة السورية التي فقدت جنسيتها بسبب زواجها من أجنبي أو بسبب تجنس زوجها السوري بجنسية أجنبية جنسيتها؟', ans:'تستردها عند انتهاء حالة الزوجية سواء بالوفاة أو الطلاق، بالإضافة إلى تقديم طلب خطي تعبّر فيه عن رغبتها في العودة إلى جنسيتها الأصلية إلى وزارة الداخلية، وموافقة وزير الداخلية على طلبها. وبموجبه تسترد المرأة جنسيتها السورية اعتباراً من تاريخ صدوره لا من تاريخ انتهاء الزوجية، والمشرع لم يستلزم من أجل استرداد المرأة السورية لجنسيتها أن تتنازل عن جنسيتها الأجنبية.', basis:'—', example:'—', tip:'نقطة مهمة يغفل عنها كثيرون: لا يُشترط التنازل عن الجنسية الأجنبية لاسترداد السورية — يمكن أن تحمل الاثنتين معاً.'},
{type:'essay', q:'ما الفرق بين الرد الجوازي والرد الوجوبي؟', ans:'نميّز بين حالتين: التجريد الإداري، وهنا يحقّ لصاحبه طلب ردّها والرد جوازي وليس وجوبياً على الدولة. أما التجريد القضائي فلا يجوز أن يُطلب ردّ الجنسية فيه، لما في ذلك من اعتداء على السلطة القضائية.', basis:'—', example:'—', tip:'التجريد الإداري = رد جوازي ممكن. التجريد القضائي = لا رد إطلاقاً (احتراماً لحكم القضاء).'},
{type:'essay', q:'ما هو المرجع القضائي المختص في مسائل الجنسية؟', ans:'يختص القضاء الإداري عادة بالنظر في مسائل الجنسية المتنازع عليها كافة، سواء بين الأفراد والإدارة أو بين الأفراد أنفسهم. فأصبح مجلس الدولة (القضاء الإداري) بموجب المرسوم ٢٧٦ لعام ١٩٦٩ النافذ حالياً صاحب الاختصاص الوحيد للفصل في دعاوى الجنسية.', basis:'المرسوم ٢٧٦ لعام ١٩٦٩.', example:'—', tip:'مجلس الدولة تحديداً هو المختص، وليس محكمة النقض أو القضاء العدلي — نقطة دقيقة تُسأل مباشرة.'},
{type:'essay', q:'على من يقع عبء إثبات الجنسية؟ وما هي وسائل الإثبات؟', ans:'ألقى المشرع عبء الإثبات دائماً على عاتق الشخص (المواطن) الذي ثار النزاع بشأن جنسيته، سواء كان يدّعي أنه يتمتع بها، أو يدفع بأنه غير متمتع بها رداً على ادعاء خصمه أنه يتمتع بها. أما وسائل الإثبات فهي عادة القيود الموجودة في دائرة الأحوال المدنية والدوائر المختصة، وأغلب الأحيان تكون بحمل البطاقة الشخصية ودفتر العائلة.', basis:'—', example:'—', tip:'العبء يقع دوماً على مثير النزاع نفسه (سواء أثبت أو نفى)، وليس على الطرف الآخر.'},
{type:'tf', q:'يستطيع أي اتحاد دولي أو تكتل إقليمي (كالاتحاد الأفريقي، أو الآسيوي، أو الأوروبي، أو مجلس التعاون الخليجي، أو جامعة الدول العربية، أو أي اتحاد كونفدرالي) أن يمنح جنسيته للأفراد المنتمين إليه.', correct:false, ans:'خطأ؛ لا تعدّ الرابطة الوظيفية التي تنشئها بعض المنظمات الدولية والإقليمية (كالأمم المتحدة وجامعة الدول العربية) بينها وبين العاملين لديها جنسية بالمعنى الحقيقي، وإن وثّقتها بجوازات سفر خاصة بها وسمّاهم البعض كذلك، لأنّ هذه المنظمات وإن كانت تتمتع بالشخصية القانونية الدولية إلا أنها ليست دولاً. ولا تعد الرابطة التي تربط فرداً عضواً في دولة عضو في هذا الاتحاد الدولي بهذا الاتحاد رابطة جنسية؛ إذ يبقى لكل دولة عضو فيه جنسيتها وشخصيتها القانونية الدولية.', basis:'—', example:'موظف في جامعة الدول العربية يحمل جواز سفر خاصاً بها، لكن هذا لا يعني أن له "جنسية عربية جامعية" — يبقى محتفظاً بجنسيته الوطنية وحدها.', tip:'هذا هو أكثر الأسئلة تكراراً على الإطلاق بين كل ما أرسلته من نماذج — يتكرر بنفس الصياغة تماماً مع تبديل اسم الاتحاد فقط في كل دورة، والجواب والتعليل ثابتان دائماً: خطأ، لأن المنظمة تتمتع بالشخصية الدولية لكنها ليست دولة.', freq:'مكرر جداً جداً — ظهر بأسماء اتحادات مختلفة (أفريقي / آسيوي / أوروبي / خليجي / كونفدرالي / عربية) في معظم النماذج المرسلة تقريباً بلا استثناء.'}
];

let cur = 0;
let answered = new Array(Q.length).fill(false);
let wrong = new Array(Q.length).fill(false);
let mistakes = 0;

const testPanel = document.getElementById('testPanel');

function buildTest(){
  testPanel.innerHTML = `
    <div class="stats">
      <div class="stat"><b id="progNum">0/${Q.length}</b><span>تم الإجابة</span></div>
      <div class="stat"><b id="mistakeNum">0</b><span>أخطاء</span></div>
    </div>
    <div class="progress-bar"><div id="progFill" style="width:0%"></div></div>
    <label class="freq-toggle">
      <input type="checkbox" id="freqToggle">
      أظهر الأسئلة الأكثر تكراراً بالامتحانات فقط (<span id="freqCount">0</span> سؤال)
    </label>
    <div class="jumper" id="jumper"></div>
    <div id="qArea"></div>
  `;
  const jumper = document.getElementById('jumper');
  let freqTotal = 0;
  Q.forEach((q,i)=>{
    const b = document.createElement('button');
    b.textContent = i+1;
    if(q.freq){ b.classList.add('freqQ'); freqTotal++; }
    b.onclick = ()=>{cur=i; renderQ();};
    jumper.appendChild(b);
  });
  document.getElementById('freqCount').textContent = freqTotal;
  document.getElementById('freqToggle').addEventListener('change', function(){
    const only = this.checked;
    document.querySelectorAll('#jumper button').forEach((b,i)=>{
      b.style.display = (!only || Q[i].freq) ? '' : 'none';
    });
    if(only && !Q[cur].freq){
      const firstFreq = Q.findIndex(q=>q.freq);
      if(firstFreq !== -1){ cur = firstFreq; renderQ(); }
    }
  });
  renderQ();
}

function renderQ(){
  const q = Q[cur];
  const qArea = document.getElementById('qArea');
  let bodyHtml = '';
  if(q.type==='tf'){
    bodyHtml = `
      <span class="q-type tf">صح أم خطأ مع التعليل</span>
      ${q.freq ? `<span class="freq-badge">🔁 ${q.freq}</span>` : ''}
      <p class="q-text">${q.q}</p>
      <div class="tf-buttons" id="tfBtns">
        <button data-v="true">صح</button>
        <button data-v="false">خطأ</button>
      </div>
    `;
  } else {
    bodyHtml = `
      <span class="q-type essay">سؤال مقالي / بحثي</span>
      ${q.freq ? `<span class="freq-badge">🔁 ${q.freq}</span>` : ''}
      <p class="q-text">${q.q}</p>
      <p class="essay-hint">فكّر بإجابتك أو دوّنها على ورقة، ثم اضغط لعرض الإجابة النموذجية للمقارنة.</p>
      <button class="reveal-btn" id="revealBtn">أظهر الإجابة النموذجية</button>
    `;
  }
  qArea.innerHTML = `
    <div class="q-header"><span>السؤال ${cur+1} من ${Q.length}</span><span>${q.type==='tf'?'صح/خطأ':'مقالي'}</span></div>
    <div class="q-card">
      ${bodyHtml}
      <div class="answer-box" id="answerBox"></div>
    </div>
    <div class="nav-buttons">
      <button id="prevBtn" ${cur===0?'disabled':''}>السابق</button>
      <button id="nextBtn" class="primary" ${cur===Q.length-1?'disabled':''}>التالي</button>
    </div>
  `;
  document.getElementById('prevBtn').onclick = ()=>{cur--; renderQ();};
  document.getElementById('nextBtn').onclick = ()=>{cur++; renderQ();};

  if(q.type==='tf'){
    document.getElementById('tfBtns').querySelectorAll('button').forEach(btn=>{
      btn.onclick = ()=>handleTF(btn.dataset.v==='true');
    });
  } else {
    document.getElementById('revealBtn').onclick = ()=>revealAnswer(true);
  }

  if(answered[cur]) revealAnswer(false, true);
  updateStats();
  document.querySelectorAll('#jumper button').forEach((b,i)=>{
    b.className = '';
    if(i===cur) b.classList.add('current');
    else if(wrong[i]) b.classList.add('wrong');
    else if(answered[i]) b.classList.add('done');
  });
}

function handleTF(userSaid){
  const q = Q[cur];
  const isCorrect = (userSaid === q.correct);
  if(!answered[cur]){
    answered[cur] = true;
    if(!isCorrect){ mistakes++; wrong[cur]=true; }
  }
  document.querySelectorAll('#tfBtns button').forEach(btn=>{
    const v = btn.dataset.v==='true';
    btn.classList.add('picked', v?'sah':'khata');
    if(v!==userSaid) btn.style.opacity='.45';
  });
  revealAnswer(true);
  updateStats();
}

function revealAnswer(mark, silent){
  const q = Q[cur];
  if(!silent && q.type==='essay' && !answered[cur]){
    answered[cur]=true;
  }
  const box = document.getElementById('answerBox');
  let verdictHtml='';
  if(q.type==='tf'){
    verdictHtml = `<span class="verdict ${q.correct?'sah':'khata'}">الجواب الصحيح: ${q.correct?'صح':'خطأ'}</span>`;
  }
  box.innerHTML = `
    ${verdictHtml}
    <div class="cards4">
      <div class="info-card explain"><b>الشرح / الإجابة النموذجية</b>${q.ans}</div>
      ${q.basis && q.basis!=='—' ? `<div class="info-card basis"><b>الأساس القانوني</b>${q.basis}</div>` : ''}
      ${q.example && q.example!=='—' ? `<div class="info-card example"><b>مثال تطبيقي</b>${q.example}</div>` : ''}
      ${q.tip ? `<div class="info-card trap"><b>نقطة امتحانية</b>${q.tip}</div>` : ''}
    </div>
  `;
  box.classList.add('show');
  updateStats();
}

function updateStats(){
  const progNum = document.getElementById('progNum');
  const mistakeNum = document.getElementById('mistakeNum');
  const progFill = document.getElementById('progFill');
  if(!progNum) return;
  const doneCount = answered.filter(Boolean).length;
  progNum.textContent = `${doneCount}/${Q.length}`;
  mistakeNum.textContent = mistakes;
  progFill.style.width = (doneCount/Q.length*100)+'%';
}

buildTest();

/* ============ TABS ============ */
function showTab(tab){
  document.getElementById('reviewPanel').style.display = tab==='review' ? 'block':'none';
  document.getElementById('testPanel').style.display = tab==='test' ? 'block':'none';
  document.getElementById('tabReviewBtn').classList.toggle('active', tab==='review');
  document.getElementById('tabTestBtn').classList.toggle('active', tab==='test');
}
</script>
